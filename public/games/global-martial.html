function trialMissing(s){return [...(narrativeActive(s)?['先处理眼前的事']:[]),...(chapter(s)!==0?['本届选拔已经结束']:[]),...(!s.talent.awake?['先完成测评']:[]),...(s.life.trial?['已经参加或放弃本届选拔']:[])];}
function enterTrial(s){const m=trialMissing(s);if(m.length)return {ok:false,text:m.join('；')};s.life.enabled=true;s.queue.push('life_trial');return {ok:true};}
function startDuel(s,index){if(s.life.duel||s.result||s.done.includes('life_trial'))return {ok:false,text:'这次选拔已在进行或已结束'};const mode=EVENTS.life_trial.choices[index]?.duelMode;if(!mode)return {ok:false};if(mode==='withdraw')return finishDuel(s,true);if(s.injury>60)return {ok:false,text:'伤势超过 60，不能参加受控对练；可以放弃本届名额'};const ds=effect(s,mode==='public'?{talent:{exposure:12,heat:8}}:{});if(mode==='public'){s.talent.mode='public';s.talent.publicGrade=s.talent.grade;s.talent.publicRank=s.rank;}s.life.duel={round:0,score:mode==='public'&&s.talent.grade>=1?1:0,stamina:4+(s.flags.life_footwork?1:0)+(s.flags.life_partner?1:0),injury:0,intent:'rush',mode,history:[],entryDs:ds};return {ok:true};}
function duelMove(s,move){const d=s.life.duel;if(!d||s.queue[0]!=='life_trial'||s.result)return {ok:false,text:'没有正在进行的交锋'};if(move==='withdraw')return finishDuel(s,true);const m=DUEL_MOVES[move];if(!m)return {ok:false};if(d.stamina<m.cost)return {ok:false,text:'耐力不足，先守住边线回气'};const correct=DUEL_INTENTS[d.intent].counter===move,gain=correct?2:move==='feint'||move==='press'&&d.intent==='bait'?1:0,hurt=move==='press'&&d.intent==='rush'?4:!correct&&move!=='guard'?2:0;d.stamina=clamp(d.stamina-m.cost,0,6);d.score+=gain;d.injury+=hurt;d.history.push({intent:d.intent,move,gain,hurt,text:correct?'你读对了重心变化，动作完整落在规则内。':gain?'你抢到一点位置，但没完全破解对手的准备。':'对方没有按你的期待出手，这一轮没拿到有效分。'});d.round++;if(d.round===3)return finishDuel(s,false);d.intent=move==='guard'?'bait':move==='feint'?'hold':'rush';return {ok:true};}
function finishDuel(s,withdraw){const d=s.life.duel,won=!withdraw&&d.score>=5,score=d?.score||0,mode=d?.mode||'withdraw';const injury=Math.max(0,(d?.injury||0)-(s.flags.life_safe_exit?6:0));const text=withdraw?'你向裁判示意退出，把护具交还。周衡拿到了这份资助；他没有拿你的退出取笑，只说以后仍可以一起练。你失去了这一项机会，身体和其他计划都还在。':won?(mode==='public'?'周衡的最后一步被你截在白线内。裁判宣布你拿到资助席，公开记录按真实成绩更新。旁观者开始重新看待你；这段展示也让更多人记住了你的出手。':'你只交出足够合格的基本动作，裁判却看得很清楚。资助席归你，公开的天赋档案保持原样。周衡摘下护具：“评级低，不代表我可以不认真对你。”'):'三轮结束，你没有达到五分。资助席归周衡。裁判逐一复盘你误读的重心，没有说你不配练武；下一次练什么，终于有了具体答案。正常武考不会因为这一次失利中止。';const ds=[...(d?.entryDs||[]),...effect(s,withdraw?{injury}:won?{xp:16,credit:5,injury,rep:mode==='public'?6:2,talent:{points:20,mastery:8},flags:['life_trial_won']}:{xp:8,injury,talent:{mastery:6},flags:['life_trial_lost']})];if(won&&mode==='public'){s.talent.feats++;ds.push(['公开战绩',1]);}s.life.trial={won,withdraw,score,mode,history:clone(d?.history||[])};s.life.duel=null;s.done.push('life_trial');s.result={id:'life_trial',title:EVENTS.life_trial.title,text:getText(EVENTS.life_trial,s),choice:withdraw?'主动退出选拔':mode==='public'?'公开实力参加选拔':'保留底牌参加选拔',result:text,ds,battle:null};record(s,EVENTS.life_trial.title,text,ds,'实绩选拔');s.feedback=text;return {ok:true};}
E('life_letter','宿舍信箱里，多了一封阳城的信',s=>'宿舍管理员把信递给你。寄件地址仍是阳城那条街，纸上先问的是吃住。\n'+(s.flags.life_honest?(s.life.trial?.won?'家里知道你拿到了资助席，回信却没催你马上赢下一场：“收到你的好消息。累的时候也可以照实写。”':s.life.trial?'家里知道选拔没有按你希望的结束：“没事，别因为一张名单不敢来信。”':'信里没有替你编一场胜利，只说有难处可以商量。'):'你之前没讲清选拔，他们便没有追问输赢，只留下一句“记得说近况”。')+'\n'+(s.flags.life_shared_notes?'吴志豪附了一行小字：你留下的笔记有人在用，一名新生已经改掉了同样的错误。':s.flags.life_support?'信封里夹着家里替你留的一份周转款；数目不大，却是你们认真商量后留下的余地。':'这封信没有带来陌生的神功，只让魔武的大校园里多了一个熟悉的地址。'),[

function scheduleLife(s){if(!s.life?.enabled)return;if(s.turn>=3&&s.life.visits.length&&!s.done.includes('life_letter')&&!s.queue.includes('life_letter'))s.queue.push('life_letter');if(s.turn>=9&&s.life.visits.length&&!s.done.includes('life_frontline')&&!s.queue.includes('life_frontline'))s.queue.push('life_frontline');}
function lifeBeforeNext(s){if(s.life.enabled&&s.turn===2&&!s.life.trial&&!s.queue.length&&!s.result){s.queue.push('life_trial');return true;}return false;}
function validateLife(l){if(!l||l.version!==1||typeof l.enabled!=='boolean')throw Error('生活记录无效');if(!Array.isArray(l.visits)||new Set(l.visits).size!==l.visits.length||l.visits.some(id=>!EVENTS[id]?.outing))throw Error('城中经历记录无效');if(!Array.isArray(l.knowledge)||new Set(l.knowledge).size!==l.knowledge.length||l.knowledge.some(k=>!LIFE_LORE[k]))throw Error('见闻记录无效');const history=h=>Array.isArray(h)&&h.length<=3&&h.every(x=>DUEL_INTENTS[x.intent]&&DUEL_MOVES[x.move]&&Number.isInteger(x.gain)&&x.gain>=0&&x.gain<=2&&Number.isInteger(x.hurt)&&x.hurt>=0&&x.hurt<=4&&typeof x.text==='string'&&x.text.length<200);if(l.duel){const d=l.duel;if(!Number.isInteger(d.round)||d.round<0||d.round>2||!Number.isInteger(d.score)||d.score<0||d.score>7||!Number.isInteger(d.stamina)||d.stamina<0||d.stamina>6||!Number.isInteger(d.injury)||d.injury<0||d.injury>12||!DUEL_INTENTS[d.intent]||!['hidden','public'].includes(d.mode)||!history(d.history)||d.history.length!==d.round||!Array.isArray(d.entryDs))throw Error('选拔交锋记录无效');}if(l.trial){const t=l.trial;if(typeof t.won!=='boolean'||typeof t.withdraw!=='boolean'||!Number.isInteger(t.score)||t.score<0||t.score>7||!['hidden','public','withdraw'].includes(t.mode)||!history(t.history))throw Error('选拔结果无效');}if(l.duel&&l.trial)throw Error('选拔状态冲突');}

function setFrontHome(s,id){if(!s.frontier.forts[id]||frontierActive(s)||s.queue.length||s.result)return {ok:false,text:'当前不能更改驻地'};s.frontier.home=id;s.feedback='你将'+frontSite(id).name+'设为主要驻地。高威胁时驻地会消耗 2 补给/期，守城可压低威胁。';return {ok:true};}
const FRONT_BOARDS={youth:{name:'青年榜',rule:'公开挑战积分；更高难度首胜才增加，同难度不重复刷分。'},talent:{name:'天才榜',rule:'已公开认证的天赋等级优先，再按公开战绩积分比较。'},power:{name:'战力榜',rule:'胜利时认证的最高出战战力；负伤、精力与装备都影响出战值。'},defense:{name:'守城榜',rule:'公开守城首胜积分；不同据点与更高难度带来新功勋。'}};
function frontBoard(s,type){const f=s.frontier;const entries=FRONT_RIVALS.filter(r=>type==='power'||r.youth).map((r,i)=>{const x=frontRival(s,r.id),merit=(i+1)*110+x.rank*70+s.turn*(i+2);return {id:r.id,name:r.name,title:r.title,power:x.power,merit,grade:r.grade,guard:Math.floor(merit*.55),player:false};});const eligible=type==='power'?f.certified>0:type==='talent'?f.grade>=0:type==='defense'?f.guardMerit>0:f.merit>0;if(eligible)entries.push({id:'player',name:s.name,title:'你的已认证战绩',power:f.certified,merit:f.merit,grade:f.grade,guard:f.guardMerit,player:true});const value=r=>type==='power'?r.power:type==='talent'?r.grade*10000000+r.merit:type==='defense'?r.guard:r.merit;return entries.sort((a,b)=>value(b)-value(a)||a.id.localeCompare(b.id)).map((r,i)=>({...r,position:i+1,display:type==='power'?r.power+' 战力':type==='talent'?GRADES[r.grade]+' · '+r.merit+' 分':(type==='defense'?r.guard:r.merit)+' 分'}));}
function frontRanks(s){return Object.fromEntries(Object.keys(FRONT_BOARDS).map(k=>[k,frontBoard(s,k).find(x=>x.player)?.position||null]));}
function scheduleFrontier(s){const f=s.frontier;const add=id=>{if(!s.done.includes(id)&&!s.queue.includes(id))s.queue.push(id);};if(f.merit>=80&&f.bosses)add('frontier_first_name');if(Object.keys(f.forts).some(id=>!frontSite(id).sim&&(f.best[id+':defend']||0)>0))add('frontier_home_letter');if(f.rivals.some(id=>FRONT_RIVALS.find(r=>r.id===id).rank>=6))add('frontier_master_invite');}
E('frontier_first_name','战报上，第一次有人圈出你的名字',s=>'你在'+(frontSite(s.frontier.last?.site)?.name||'挑战场')+'留下的战报被送到训练处。负责登记的老师没有问旧评级，只看了通关记录。\n“这些是你打出来的。接下来想争公开名次，还是把更多时间留给守城？”\n榜上的名字也有来历。周衡是阳城演训首席，裴星澜是已踏上前线的六品青年。你可以从认识他们、追赶他们开始。',[O('争取更多挑战机会','老师替你整理了后续挑战的申请，提醒你先比较敌我实力。',{credit:4}),O('把资源留给长期驻守','你把这份认可换成前线需要的补给，准备让据点多撑一些时候。',{supply:8})],{kind:'据点后续',compact:true});
E('frontier_home_letter','守住的地方，有人记得',s=>'守城的记录寄到了后方。信里没有评价你的招式，只写着一句：“城门没破，最后一队人也回来了。”\n'+(frontSite(Object.keys(s.frontier.forts).find(id=>!frontSite(id).sim&&(s.frontier.best[id+':defend']||0)>0))?.name||'前线据点')+'仍会有下一次警报。你可以继续迎战，也可以把资源放进修复和补给。',[O('补充守备物资','这份支持被送入物资库。',{supply:10}),O('整理战斗中的薄弱环节','你把险些失守的地方记下，下一场会更清楚该保护什么。',{skill:5})],{kind:'据点后续',compact:true});
E('frontier_master_invite','强者们开始谈论你的战绩','公开挑战中的胜利，让更多高阶武者注意到了你。\n“名次只是战报的一种排列。”来信的人说，“如果你想更进一步，下一场就让我们看见你如何判断、如何保护身后的人。”\n七品、八品、九品与绝巅的名字都在公开挑战名册里。没有人会因为邀请而降低自己的实力。',[O('继续准备越阶挑战','你把邀请留下，先补齐自己距离对手的差距。',{credit:8}),O('先把现有据点守稳','你回复了邀请，也说明自己暂时不能离开防线。',{defense:8})],{kind:'据点后续',compact:true});
function validateFrontier(f,s){
 const fail=()=>{throw Error('据点战斗存档无效');},int=(n,a,b)=>Number.isInteger(n)&&n>=a&&n<=b,plain=x=>x&&typeof x==='object'&&!Array.isArray(x),validKey=k=>{const [id,mode,...rest]=k.split(':');return !rest.length&&(mode==='rival'?FRONT_RIVALS.some(x=>x.id===id):frontSite(id)&&['hunt','dungeon','defend'].includes(mode));};
 if(!plain(f)||f.version!==1||!plain(f.best)||!plain(f.publicBest)||!plain(f.attempts)||!plain(f.forts))fail();
 for(const field of ['wins','bosses','defenses','merit','guardMerit','certified','mastery'])if(!int(f[field],0,100000000))fail();if(!int(f.grade,-1,6))fail();
 for(const k of ['best','publicBest','attempts'])if(Object.keys(f[k]).length>40||Object.entries(f[k]).some(([key,n])=>!validKey(key)||!int(n,k==='attempts'?0:1,k==='attempts'?s.turn:3)))fail();
 if(Object.entries(f.publicBest).some(([k,v])=>v>(f.best[k]||0)))fail();
 if(!frontSite(f.home)||!Object.hasOwn(f.forts,f.home)||Object.entries(f.forts).some(([id,x])=>!frontSite(id)||!plain(x)||!int(x.integrity,0,100)||!int(x.threat,0,100)))fail();
 if(!Array.isArray(f.rivals)||new Set(f.rivals).size!==f.rivals.length||f.rivals.some(id=>!FRONT_RIVALS.some(r=>r.id===id)||!f.publicBest[id+':rival']))fail();
 const report=x=>{if(!plain(x)||!validKey(x.site+':'+x.mode)||!int(x.tier,1,3)||!['won','retreat','first','publicMode'].every(k=>typeof x[k]==='boolean')||!['title','text'].every(k=>typeof x[k]==='string'&&x[k].length<6000)||!int(x.turn,0,s.turn)||!int(x.rounds,0,24)||!Array.isArray(x.ds)||x.ds.length>40||x.ds.some(d=>!Array.isArray(d)||typeof d[0]!=='string'||d[0].length>100||!Number.isFinite(d[1]))||!Array.isArray(x.rankChanges)||x.rankChanges.length!==4||x.rankChanges.some(r=>!FRONT_BOARDS[r.key]||[r.before,r.after].some(v=>v!==null&&!int(v,1,20))))fail();};
 if(f.receipt)report(f.receipt);if(f.last)report(f.last);
 if(f.battle){const b=f.battle;if(!plain(b)||!validKey(b.site+':'+b.mode)||!Object.hasOwn(FRONT_STANCES,b.stance)||typeof b.publicMode!=='boolean'||!int(b.tier,1,3)||b.turn!==s.turn||!int(b.wave,0,FRONT_MODES[b.mode].waves-1)||!int(b.round,0,23)||!int(b.hp,1,100)||!int(b.wall,1,100)||!int(b.stamina,0,6)||!int(b.enemyHp,1,130)||!int(b.ours,1,1000000)||!int(b.enemy,1,1000000)||!int(b.rank,0,10)||!int(b.intent,0,2)||f.attempts[b.site+':'+b.mode]!==s.turn||!Array.isArray(b.history)||b.history.length!==b.round||b.history.some(h=>!FRONT_MOVES[h.move]||!FRONT_INTENTS.some(i=>i.id===h.intent)||!['damage','hurt','wallHurt'].every(k=>int(h[k],0,100))||typeof h.text!=='string'||h.text.length>200))fail();}
 if(f.battle&&f.receipt||(f.battle||f.receipt)&&(s.queue?.length||s.result||s.life?.duel))fail();return clone(f);
}

function frontierIntent(s){if(!s.talent.awake||hasPrivateSystem(s)&&s.systemIntro.step<4)return null;const home=frontSite(s.frontier.home),fort=s.frontier.forts[home.id];if(fort.threat>=60){if(fort.integrity<20)return {title:home.name+'需要修复',reason:'城防已不足20。先修复，才能出战守城。',label:'查看驻地',action:'frontTarget',value:home.id+':fort'};if(!frontMissing(s,home.id,'defend',1).length)return {title:'驻地传来警报',reason:home.name+'的威胁已达'+fort.threat+'。迎击来敌可修复城防并降低袭扰。',label:'前往驻地守城',action:'frontTarget',value:home.id+':defend'};}

let frontSiteIndex=0,frontMode='dungeon',frontTier=1,frontStance='balanced',frontPublic=true,frontPanel='mission',frontBoardType='youth',frontBoardPage=0,frontRivalId='zhou';
function frontFrame(title,content,footer,nav=''){return `<div class="front-shell ${nav?'front-with-nav':''}"><header class="front-header"><div><span>人间万相 · 战场与战绩</span><h1>${title}</h1></div>${button('返回日常','tab','season','btn sm')}</header>${nav?'<nav class="front-nav" aria-label="战场分页">'+nav+'</nav>':''}<main class="front-content" tabindex="-1">${content}</main><footer class="front-footer">${footer}</footer></div>`;}
function frontierHub(s){if(frontPanel==='boards')return frontBoardsView(s);if(frontPanel==='rival')return frontRivalView(s);const site=FRONT_SITES[frontSiteIndex],fort=s.frontier.forts[site.id],p=frontPreview(s,site.id,frontMode,frontTier,frontStance),missing=frontMissing(s,site.id,frontMode,frontTier);const pager=`${button('‹ 上一据点','frontSite',frontSiteIndex-1,'btn sm',frontSiteIndex===0)}<span>${frontSiteIndex+1} / ${FRONT_SITES.length}</span>${button('下一据点 ›','frontSite',frontSiteIndex+1,'btn sm',frontSiteIndex===FRONT_SITES.length-1)}`;
 let content='';if(frontPanel==='tactics')content=`<h2>出战前，确定你的打法</h2><p class="hint">选择会保留，开始战斗时才生效。</p><div class="front-options">${Object.entries(FRONT_STANCES).map(([id,v])=>`<button class="btn ${frontStance===id?'pri':''}" data-do="frontStance" data-value="${id}" aria-pressed="${frontStance===id}"><b>${v.name}</b><span>${v.desc}</span></button>`).join('')}</div><h3>战报如何处理</h3><div class="row">${button('公开胜绩，争取排名','frontPublic','public','btn'+(frontPublic?' pri':''))}${button('匿名磨砺，保留底牌','frontPublic','hidden','btn'+(!frontPublic?' pri':''))}</div><p class="hint">公开胜利会更新天赋档案，增加曝光 20、猎杀热度 20；匿名也获得成长奖励，但不写入榜单。</p>`;
 else if(frontPanel==='fort')content=`<h2>${fort?'你的据点':'尚未建立据点'}</h2>${fort?`<div class="front-metrics"><span>城防 <b>${fort.integrity}/100</b></span><span>威胁 <b>${fort.threat}/100</b></span></div><p>${site.sim?'这里是安全演训，城防损失只发生在演训中，不产生真实袭扰。':'每期威胁 +15；达到 60 后每期城防 −10。主要驻地同时损失 2 补给。守城胜利修复 25 城防、降低 40 威胁。'}</p><div class="front-options">${button('修复城防 · 1 行动 / 5 学分','frontRepair',site.id,'btn',s.ap<1||s.credit<5||fort.integrity===100)}${button(s.frontier.home===site.id?'当前主要驻地':'设为主要驻地','frontHome',site.id,'btn',s.frontier.home===site.id)}</div><p class="hint">城防低于 20 时先修复，再迎战。守城也有战报与独立功勋榜。</p>`:'<p>首次通关这里的首领副本后，建立驻地并开放守城。守城不额外要求推进新的原剧情。</p>'}`;
 else content=`<div class="front-kicker">${site.sim?'演训 / 无真实击杀':'地窟前线 / 原创支线'} · ${site.theme}</div><h2>${site.name}</h2><p>${site.desc}</p><div class="front-modes">${['hunt','dungeon','defend'].map(id=>button(FRONT_MODES[id].name,'frontMode',id,'btn sm'+(frontMode===id?' pri':''))).join('')}</div><p class="hint">${FRONT_MODES[frontMode].desc}</p><div class="front-metrics"><span>你的出战战力 <b>${p.ours}</b></span><span>对手参考战力 <b>${p.enemy}</b></span></div>${frontMode!=='hunt'&&site.bossRule?'<p class="hint"><b>首领机制：</b>'+site.bossRule+'</p>':''}<p class="front-enemy">${frontMode==='dungeon'?'首领：'+site.boss:frontMode==='defend'?'守城终敌：'+site.boss:'精英：'+site.enemies[0]} · ${REALMS[p.rank]}</p><div class="row">${[1,2,3].map(n=>button(['标准','精英','极限'][n-1],'frontTier',n,'btn sm'+(frontTier===n?' pri':''))).join('')}</div><p class="hint">${frontTier>1?'高一级难度需要先通过前一级。':'每据点每种模式每期可挑战一次。'}首领首通主要奖励进化点与修为；普通胜利积累修为与学分。</p>`;

function frontBoardsView(s){const rows=frontBoard(s,frontBoardType),self=rows.find(x=>x.player),pages=Math.max(1,Math.ceil(rows.length/4)),page=Math.min(frontBoardPage,pages-1),near=self?rows.find(x=>x.position===self.position-1):rows.at(-1);return frontFrame(FRONT_BOARDS[frontBoardType].name,`<p class="hint">${FRONT_BOARDS[frontBoardType].rule}</p><p class="front-standing">${self?'你目前第 '+self.position+' 名 · '+self.display:'你尚未取得这张榜单的公开认证。'}${near?'下一位追赶对象：'+esc(near.name)+'。':''}</p><div class="front-ranks">${rows.slice(page*4,page*4+4).map(r=>`<div class="front-rank ${r.player?'is-player':''}"><b>${r.position}</b><div><strong>${esc(r.name)}</strong><small>${esc(r.title)}</small></div><span>${r.display}</span>${r.player?'<span>你</span>':button('了解 / 挑战','frontRival',r.id,'btn sm')}</div>`).join('')}</div><p class="hint">本作原创挑战名册，不是在线玩家榜，也不代表原著全部强者。对手公开成绩随期数成长；同一规则用于排名与约战实力。</p>`,`<div class="front-submit">${button('‹ 上一页','frontBoardPage',page-1,'btn',page===0)}<span>${page+1}/${pages}</span>${button('下一页 ›','frontBoardPage',page+1,'btn',page===pages-1)}${button('返回据点','frontPanel','mission','btn')}</div>`,Object.entries(FRONT_BOARDS).map(([id,b])=>button(b.name,'frontBoard',id,'btn sm'+(frontBoardType===id?' pri':''))).join(''));}
function frontRivalView(s){const r=frontRival(s,frontRivalId),miss=frontMissing(s,r.id,'rival',1);return frontFrame('榜上强者 · '+r.name,`<div class="front-kicker">${r.youth?'青年强者':'高阶标杆'} · 原创人物</div><h2>${r.title}</h2><p>${r.bio}</p><div class="front-metrics"><span>你 <b>${power(s)}</b></span><span>${r.name}<b>${r.power}</b></span></div><p>${REALMS[r.rank]} · ${GRADES[r.grade]} 级公开天赋。对方按这个实际战力迎战，不随你的境界缩放。</p><div class="front-options">${Object.entries(FRONT_STANCES).map(([id,x])=>button(x.name+' · '+x.desc,'frontStance',id,'btn'+(frontStance===id?' pri':''))).join('')}</div><p class="hint">点到即止，失利仍可能受伤。获胜取得唯一挑战认证、进化点与公开战绩；会公开真实天赋并增加曝光、猎杀热度各 20。</p>`,`<div class="front-cost">${miss.length?esc(miss.join('；')):'1 行动 · 20 精力 · 公开挑战'}</div><div class="front-submit">${button('返回榜单','frontPanel','boards','btn')}${button('向'+r.name+'发起挑战','frontChallenge',r.id,'btn pri',miss.length>0)}</div>`);}
function frontBattleView(s){const f=s.frontier,b=f.battle;if(!b)return frontReceiptView(s);const intent=FRONT_INTENTS[b.intent],last=b.history.at(-1);const content=`<div class="front-kicker">${FRONT_MODES[b.mode].name} · 第 ${b.wave+1}/${FRONT_MODES[b.mode].waves} 波 · 回合 ${b.round+1}/24</div><h2>${frontEnemyName(b)}</h2><div class="front-metrics"><span>自身 <b>${b.hp}/100</b></span><span>敌方 <b>${b.enemyHp}</b></span><span>耐力 <b>${b.stamina}/6</b></span>${b.mode==='defend'?'<span>城防 <b>'+b.wall+'/100</b></span>':''}</div>${b.wave===2&&frontSite(b.site)?.bossRule?'<p class="hint">'+frontSite(b.site).bossRule+'</p>':''}<div class="front-signal"><b>对手正在${intent.name}</b><p>${intent.tell}</p></div>${last?`<p class="front-battle-log" role="status">${last.text} 造成 ${last.damage} 伤害 / 承受 ${last.hurt} 伤害${last.wallHurt?' / 城防 −'+last.wallHurt:''}。</p>`:'<p class="hint">读招决定反制，耐力决定能否出手；24 回合内通关。剩余体力会影响战后伤势。</p>'}`;const controls=`<div class="front-combat-controls">${Object.entries(FRONT_MOVES).map(([id,m])=>`<button class="btn" data-do="frontMove" data-value="${b.round}:${id}" ${b.stamina<m.cost?'disabled':''}><b>${m.name}</b><small>${m.desc}</small></button>`).join('')}</div>${button('撤离 · 不返还出战消耗','frontMove',b.round+':retreat','text-button')}`;return `<div class="front-shell front-combat" data-page-kind="front-battle"><header class="front-header"><h1>${frontSite(b.site)?.name||'公开挑战'}</h1><span>${FRONT_STANCES[b.stance].name} · ${b.publicMode?'公开':'匿名'}</span></header><main class="front-content" tabindex="-1">${content}</main><footer class="front-footer">${controls}</footer></div>`;}
function frontReceiptView(s){const r=s.frontier.receipt;return `<div class="front-shell" data-page-kind="front-result"><header class="front-header"><h1>${esc(r.title)}</h1><span>已结算</span></header><main class="front-content" tabindex="-1"><h2>${r.won?'这一战，留下了新的记录':r.retreat?'先回来，再准备':'败战也会留在经历里'}</h2><p>${esc(r.text)}</p>${dsHTML(r.ds.filter(([k])=>['修为','进化点','学分','伤势'].includes(k)))}<div class="front-rank-changes">${r.rankChanges.map(x=>`<p>${FRONT_BOARDS[x.key].name}：${x.before?'第 '+x.before+' 名':'未入榜'} → <b>${x.after?'第 '+x.after+' 名':'未入榜'}</b></p>`).join('')}</div><details class="action-details"><summary>完整战后变化</summary>${dsHTML(r.ds)}</details></main><footer class="front-footer">${button('确认战报，继续旅程','frontAck','','btn pri')}</footer></div>`;}

function lifeNews(s){const a=[];if(s.life.trial)a.push(s.life.trial.won?(s.life.trial.mode==='public'?'操场公示：你的实绩获得复核，资助席已确认。':'操场公示：资助席名单有你的名字，天赋档案仍保留原评级。'):s.life.trial.withdraw?'周衡拿到资助席。你主动保留了身体与原定计划。':'周衡拿到资助席。裁判的复盘留在你的训练记录里。');if(s.flags.life_verified)a.push('诊所确认夜间车队属于正规转运，去向仍待查证。');else if(s.flags.life_clinic_help)a.push('许姐记住了你的名字；有可以核实的转运消息会留给你。');if(s.flags.life_support)a.push('小院账本记下了你留下的家用，入学后这份支持会有回应。');if(s.flags.life_partner)a.push('方平愿意替你核验训练记录；选拔开场耐力 +1。');if(s.flags.life_read_rival)a.push('周衡知道你看过他的录像，也记得你指出的不足。');if(!a.length)a.push(isGenius(s)?'操场上的人正等你公开示范；高评级带来资源，也让你失去不被注意的自由。':'教务室把 D 级列在候补栏；资助席允许凭实绩复核，旧评级不是禁止上场的理由。');return a.slice(0,4);}
function lifeHub(s){const l=s.life;const knowledge=l.knowledge.map(k=>`<details class="life-lore"><summary>${esc(LIFE_LORE[k][0])}</summary><p>${esc(LIFE_LORE[k][1])}</p></details>`).join('');if(chapter(s)>0)return l.visits.length||l.knowledge.length?`<section class="paper life-after"><div class="section-label">走出阳城之后</div><h2>有些事，会跟着你走得更远</h2><p>${l.trial?.won?'资助席来自你亲自完成的对练。':l.trial?'你没有拿到那份资助，但这不是武道的终点。':''}${s.flags.life_honest?'你给家里留了说真话的约定。':''}${s.flags.life_verified?'诊所转运单上的编号，仍在你的笔记里。':''}</p>${knowledge?`<details><summary>翻开亲历见闻 · ${l.knowledge.length} 条</summary>${knowledge}</details>`:''}</section>`:'';
 const route=hasPrivateSystem(s)?s.systemIntro.step===0?'先去旧操场练一次，再去武馆校准；训练本身就会推进系统任务。':s.systemIntro.step===1?'系统已有第一份数据。去街巷武馆校准动作，继续完成验证与首次进化。':s.systemIntro.step===2?'训练数据已齐，先完成眼前的验证。':s.systemIntro.step===3?'数据足够第一次进化。完成 D → C 后，再决定是否公开参加选拔。':'你已走通第一次进化。可以准备选拔，也可以先追诊所与家书的线索。':'别人已经把你当成天才。上场前，可以练收招、找搭档或学会撤离；评级不会替你读懂对手。';
 return `<section class="life-hub" data-anchor="life"><header class="life-heading"><div class="section-label">你正在生活的地方 · 第 ${s.turn+1} / 3 期</div><h2>阳城，灯还亮着</h2><p>学校在收报名表，长街药房刚换上新价签。<br>夜里的车又经过巷口，早餐铺明天照常开门。</p><div class="life-skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div></header><div class="life-hub-body"><div class="life-now"><b>今天，把时间留给谁？</b><span>还有 ${s.ap} 次行动</span><p>${route}</p></div><div class="life-map">${LIFE_PLACES.map(p=>{const id=nextLifeEvent(s,p.id),e=EVENTS[id],missing=outingMissing(s,p.id),count=p.ids.filter(id=>s.done.includes(id)).length;return `<button class="life-place ${p.id}" data-do="outing" data-value="${p.id}" ${missing.length?'disabled':''}><span class="place-sign">${p.mark}</span><div><h3>${p.name}</h3><p>${p.lead}</p><strong>${e?e.title:'这条街记住了你的三次来访'}</strong><small>${missing.length?esc(missing[0]):p.benefit+' · 决定后用 1 次行动'}</small><small>已亲历 ${count} / 3</small></div></button>`}).join('')}</div>
 <div class="life-goal"><div><span class="section-label">你与周衡都需要的机会</span><h3>一份资助席，三次交锋</h3><p>第三期结束前作决定。看重心、留耐力，三轮累计 5 分过线；失败或退出仍能正常武考。提前参加会少一些准备时间。</p><div class="life-prep">${[['life_footwork','退步训练','耐力 +1'],['life_partner','可信搭档','耐力 +1'],['life_read_rival','对手笔记','读招提示'],['life_safe_exit','撤离准备','失误伤势 −6']].map(([flag,name,effect])=>`<span class="${s.flags[flag]?'ready':''}">${s.flags[flag]?'✓':'○'} ${name}<small>${effect}</small></span>`).join('')}</div></div>${l.trial?`<div class="life-verdict"><b>${l.trial.won?'资助席已获得':l.trial.withdraw?'已主动退出':'本次未获资助'}</b><p>${l.trial.withdraw?'你保住了身体和后续计划。':l.trial.score+' 分 · 结果不会因刷新重抽。'}</p></div>`:button('去选拔场 · 可先了解规则','lifeTrial','','btn pri',trialMissing(s).length>0)}</div>
 <details class="life-bulletin" open><summary>这座城对你的回应</summary>${lifeNews(s).map(x=>'<p>'+esc(x)+'</p>').join('')}</details><details class="life-bulletin"><summary>亲历见闻 · ${l.knowledge.length} 条</summary>${knowledge||'<p>先去见人、做事。只有亲自经历或核实过的内容，才会写进这里。</p>'}</details><p class="life-note">每期只有三次行动，无法同时顾全所有事。选地点先看情境，作决定才花时间；普通修炼仍可在下方安排。城中人物与选拔是本作原创分支。</p></div></section>`;
}
function duelView(s){const d=s.life.duel,intent=DUEL_INTENTS[d.intent],last=d.history.at(-1);return `<section class="reader-page duel-page" data-page-kind="duel"><div class="reader-eyebrow">资助席选拔 · 第 ${d.round+1} / 3 次交锋</div><h2>周衡把重心换到了另一只脚</h2><p>同届考生，与你争同一份资助。${d.mode==='hidden'?'你保留天赋底牌，场上只用基本动作。':'你已经公开当前实力，这场表现会留在记录里。'}</p><div class="duel-track"><span>有效得分 <b>${d.score} / 5</b></span><span>耐力 <b>${d.stamina} / 6</b></span><span>本次失误伤势 <b>${Math.max(0,d.injury-(s.flags.life_safe_exit?6:0))}</b></span></div><div class="duel-stance"><div class="duel-lines" aria-hidden="true"></div><div><small>你看见的动作</small><p>${intent.tell}</p>${s.flags.life_read_rival?`<p class="duel-insight">录像笔记：${intent.name} → ${DUEL_MOVES[intent.counter].name}</p>`:''}</div></div>${last?`<div class="duel-feedback" role="status"><b>上一轮 · ${DUEL_MOVES[last.move].name} · 得分 +${last.gain}</b><p>${last.text}${last.hurt?'护具没能完全挡住碰撞，记入失误伤势 '+last.hurt+'。':''}</p></div>`:'<p class="hint">读对动作得 2 分。每次选择后，对手会根据你的动作调整下一轮。</p>'}<div class="opts">${Object.entries(DUEL_MOVES).map(([id,m],i)=>`<button class="opt" data-do="duelMove" data-value="${id}" ${d.stamina<m.cost?'disabled':''}><span class="choice-num">${i+1}</span><span><strong>${m.name}</strong><small>${m.desc}</small></span></button>`).join('')}</div>${button('示意退出，保留身体与后续计划','duelMove','withdraw','btn sm duel-withdraw')}</section>`;}
function lifeMissionButton(s,action,label){const id=action==='train'&&!s.done.includes('life_school_0')?'school':['study','spar'].includes(action)&&!s.done.includes('life_alley_0')?'alley':null;return s.life.enabled&&chapter(s)===0&&id?button('去'+(id==='school'?'旧操场':'街巷武馆')+'完成任务','outing',id,'btn pri next',!!outingMissing(s,id).length):button(label,'systemAct',action,'btn pri next',!!actionMissing(s,action).length);}

function lifeCastInline(e,s){const cast=eventCast(e,s,null).filter(n=>!s.introduced.includes(n.id));return cast.length?`<aside class="life-cast">${cast.map(n=>`<p><b>${esc(n.id)}</b> · ${esc(PERSON_INTROS[n.id].identity)}。${esc(PERSON_INTROS[n.id].relationship)}。</p>`).join('')}</aside>`:'';}

const WORLD_TALENT_RATE=1;
const WORLD_INTRO=[
 {tag:'世界背景',title:'你熟悉的城市，藏着另一场战争',lead:'这是一个有学校、工作和普通家庭的现代世界。但武者，拥有改变个人命运、也足以守护一座城的力量。',paragraphs:['在大多数人的生活里，武者意味着地位、收入和向上的机会。学生报考武科，家庭为营养与训练省钱；考进武道大学，是普通人接触系统培养的一条路。','平静的地面之下，是与人类世界相连的地窟。那里有城池、敌对势力与复杂的利益冲突。人族强者、武大与军部承担防卫，许多普通人起初并不知道战争的全貌。','你的故事从阳城备考开始，随后走进武大、前线与更大的局势。玩家先了解这张背景；故事里的你，会在亲身经历中逐渐知道其中的秘密。'],note:'世界观取材于《全球高武》；人物对白与你的个人经历为原创分支。'},
 {tag:'世界的规则',title:'力量、资源与责任，连在一起',lead:'天赋决定潜力，武道境界决定你真正走到了哪里。一个高评级的新生，仍需要从基础开始。',paragraphs:[`在本作的社会背景中，每 100 名普通受测者约有 ${WORLD_TALENT_RATE} 人显现可评级的特殊天赋。这是改编设定中的约 1% 人口比例，不是原著统计，也不是玩家的抽取概率。没有特殊天赋的人，仍可以通过培养气血、站桩和淬骨成为武者。`,'觉醒天赋，是发现身体的特殊潜力；成为一品武者，是完成训练后的境界突破。两者不是同一件事。本作的十位主角都已绑定命格，完成测评必定觉醒（100%），不会因为一次随机失败失去这条人生。','非武者先练气血、站桩与基础战法。本作把这份积累记作「修为」。满足修为、精神、学分和身体状态的要求后，主动突破，才成为一品。条件齐备就成功，不掷成功率。入品之后，从淬骨走向内腑、三焦，再到精神具现、金身与本源。','武大提供指导、丹药、兵器与训练机会，学分连接这些资源。你要决定把时间和钱花在哪里，也要在个人成长、队友需要和任务风险之间取舍。','境界越高，你会面对更大的职责。低品学会自保与协作，高阶参与守城、调配、谈判和传承；敌方的王庭也有各自立场，并不是一个没有区别的敌人。'],stages:[['一至三品','淬骨，打牢身体根基'],['四至六品','内腑与三焦，协调身体'],['七至九品','精神、金身与本源'],['绝巅及以上','更高层次与更大的局势']],note:'约 1% 的特殊天赋比例、必定觉醒的主角与数值突破门槛，均为本作改编；绝巅不是原著力量体系的终点。'},
 {tag:'你的成长规则',title:'一张评级单，不会写完你的一生',lead:'本作加入 D → C → B → A → S → SS → SSS 的可进化天赋。它与武道境界分开计算，也固定属于各自的角色。',paragraphs:['天才角色以 S—SSS 级觉醒，得到关注与培养，也更容易进入敌方的猎杀名单。你要决定怎样使用声望、保护自己与同行的人。','D 级角色起初被低估，却拥有私人系统。完成真实的训练和任务，获得进化点与熟练度，再满足条件进化；你可以隐藏成长，也可以用公开战绩改变别人的态度。','每期有三次行动。故事中的决定会改变关系与机会，训练会改变能力。你也可以前往不同据点讨伐、挑战首领、建立驻地并守城；公开胜绩会写入青年、天才、战力与守城榜。处理完当前剧情后，才安排成长与生活；选择前会说明条件与代价。'],note:'D—SSS 评级、原创角色私人系统与进化，是本作的改编规则，不是原著的通用天赋制度。'}
];

function identityView(o){const d=DESTINY_BY[o.destiny],initial=createRun(o.id,selectedPerk,o.roleName,1);return `<div class="welcome-shell identity-shell"><header class="welcome-top"><span>全球高武 · 你的身份</span>${button('回看世界观','worldIntro',2,'btn sm')}</header><main class="welcome-main" data-view="identity"><div class="identity-selector"><label class="quiet-label" for="origin-select">选择人生 · 属性与命格同步更新</label><select id="origin-select">${ORIGINS.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${x.roleName} · ${x.entryTitle}</option>`).join('')}</select></div><div class="identity-content">${identityStartingStats(initial)}<article class="identity-story"><div class="welcome-kicker">${o.name}</div><h1>你是${esc(o.roleName)}</h1><details class="quiet-details"><summary>了解你的经历</summary><div class="welcome-prose">${paras(o.desc)}</div></details><div class="identity-fate"><b>属于你的命格</b><p>${esc(d.gift)}</p><p>出身特性：${esc(o.trait)}</p><p>${GRADES[d.grade]} 级 · ${d.name}。${d.route==='underdog'?'觉醒时评级偏低，私人系统会陪你完成训练与进化。':'觉醒将带来培养机会与关注，也会使你面临追踪和袭杀。'}</p><small>命格随角色固定，不另行抽取或选择；进入故事后完成觉醒。</small></div></article><section class="quiet-details"><h2>姓名与性格</h2><label class="quiet-label" for="character-name">姓名</label><input class="nm" id="character-name" aria-label="角色姓名" maxlength="12" value="${esc(draftNames[o.id]||o.roleName)}"><div class="perk-grid">${PERKS.map(p=>`<button class="perk-card" data-do="perk" data-value="${p.id}" aria-pressed="${selectedPerk===p.id}"><b>${p.name}</b><p>${p.desc}</p></button>`).join('')}</div></section></div><footer class="welcome-actions identity-actions">${button('成长教程（可选）','previewBriefing',0,'btn')}${button('进入我的故事 ▸','start','','btn pri')}</footer></main></div>`;}
function currentIntent(s){const expedition=frontierIntent(s);if(expedition)return expedition;let step=evolutionTaskStep(s);if(chapter(s)===0&&s.life.enabled){if(hasPrivateSystem(s)&&s.systemIntro.step===0&&!s.done.includes('life_school_0')&&!outingMissing(s,'school').length)return {title:'先把第一步练稳',reason:'旧操场正在分配训练位置。完成一次修炼，看看你的系统会怎样回应。',label:'去旧操场 · 1 次行动',action:'outing',value:'school'};if(hasPrivateSystem(s)&&s.systemIntro.step===1&&!s.done.includes('life_alley_0')&&!outingMissing(s,'alley').length)return {title:'把进步变成能验证的动作',reason:'去街巷武馆校准发力。这里的训练会同时推进系统任务，不必再额外刷一次。',label:'去街巷武馆 · 1 次行动',action:'outing',value:'alley'};if(s.turn===2&&!s.life.trial&&s.systemIntro.step!==3)return {title:'资助席即将决定归属',reason:'这是备考的最后一期。你可以先看选拔规则、再决定上场或回去准备；也能主动放弃这个名额。',label:'去选拔场',action:'lifeTrial',value:''};}
 return {...step,title:step.action==='evolveTalent'?'你已走到进化的门前':step.action==='next'?'整理好这一期，继续向前':step.action==='breakthrough'?'试着跨过下一道门槛':currentTalentQuest(s)?.title||'接下来，走自己的路'};}

function arrangementView(s){return `<section class="quiet-section" data-view="arrange">${button('‹ 回到当前','tab','season','text-button')}<h1>这段时间，留给什么？</h1><p class="hint">本期还有 ${s.ap} 次行动。选地点先看情境，作决定才使用行动。</p>${chapter(s)===0?`<div class="quiet-list">${LIFE_PLACES.map(p=>{const m=outingMissing(s,p.id),e=EVENTS[nextLifeEvent(s,p.id)];return `<button data-do="outing" data-value="${p.id}" ${m.length?'disabled':''}><span><b>${p.name}</b><small>${esc(m[0]||e?.title||'已完成')}</small></span><span>›</span></button>`}).join('')}${!s.life.trial?`<button data-do="lifeTrial" data-value="" ${trialMissing(s).length?'disabled':''}><span><b>资助席选拔</b><small>第三期结束前决定 · 可先了解规则</small></span><span>›</span></button>`:`<p class="hint">资助席：${s.life.trial.won?'你已获得':s.life.trial.withdraw?'你已退出':'本次未获选'}。</p>`}</div>`:''}<details class="quiet-details" ${chapter(s)>0?'open':''}><summary>修炼、工作与休整</summary><div class="action-grid">${ACTIONS.map(a=>focusedAction(s,a.id)).join('')}</div><p class="hint">先按你要提升的能力选择。每项使用 1 次行动；附带成长和系统奖励可展开查看。</p></details><p class="hint">当前精力 ${s.energy}/100 · 伤势 ${s.injury}。装备、拜访和探索可从「更多」进入。</p>${quietActionReceipt(s)}</section>`;}
function characterView(s){return `<section class="quiet-section" data-view="character"><div class="welcome-kicker">${esc(s.name)} · ${REALMS[s.rank]}</div><h1>${esc(talentName(s))}</h1><nav class="quiet-subnav" aria-label="角色详情">${[['growth','进化'],['tasks','任务'],['stats','属性'],['guide','成长说明']].map(([id,t])=>button(t,'characterSection',id,'btn sm'+(characterSection===id?' pri':''))).join('')}</nav>${characterSection==='growth'?evolutionProgressView(s):characterSection==='tasks'?systemConsole(s):characterSection==='guide'?growthBriefing(s,briefingIndex,false):quietStats(s)}</section>`;}
function quietStats(s){const m=breakthroughMissing(s);return `<div class="quiet-stats">${[['当前境界',REALMS[s.rank]],['修为',s.xp],['精神',s.mind],['战法',s.skill],['精力',s.energy+'/100'],['伤势',s.injury],['资金',s.cash+'万'],['学分',s.credit],['公开天赋',GRADES[s.talent.publicGrade]||'待觉醒'],['猎杀热度',s.talent.heat+'/100']].map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div><p class="hint">${esc(m.join('；')||'条件齐备，可以突破下一境界。')}</p>${button('这些属性有什么用，怎样提升？','growthPage',0,'text-button')}${quietActionReceipt(s)}${button('尝试武道突破','breakthrough','','btn pri',m.length>0)}<details class="quiet-details"><summary>控制曝光与追踪</summary><p class="hint">敛息与反侦察各用 1 行动、10 精力。已出现的袭杀仍需要处理。</p><div class="row">${button('敛息潜修','stealth','conceal','btn',!s.talent.awake||s.ap<1||s.energy<10)}${button('反侦察','stealth','counter','btn',!s.talent.awake||s.ap<1||s.energy<10)}</div></details>`;}
function moreView(s){return `<section class="quiet-section" data-view="more"><h1>需要时，再打开</h1><div class="quiet-list">${[['据点与副本','讨伐首领、建立驻地、迎击攻城','frontPanel','mission'],['强者与排行榜','青年、天才、战力与守城战绩','frontPanel','boards'],['行囊与兑换','查看物资、使用药剂或购买装备','tab','bag'],['地图与机缘','选择地点，探索尚未经历的机会','tab','chance'],['人物与纪事','拜访故人，回看你的选择','tab','world'],['世界与见闻','回顾世界背景、城里的回应与已知线索','notebook',''],['存档与导出','保留分支或带走这一世','save',''],['设定与玩法','查看完整规则说明','guide','']].map(([title,desc,action,value])=>`<button data-do="${action}" data-value="${value}"><span><b>${title}</b><small>${desc}</small></span><span>›</span></button>`).join('')}</div></section>`;}
function notebookView(s){return `<section class="quiet-section" data-view="notebook">${button('‹ 返回更多','tab','more','text-button')}<h1>世界与亲历见闻</h1>${button('重新阅读世界背景','worldIntro',0,'btn')}<details class="quiet-details"><summary>城里的人怎样回应你</summary>${lifeNews(s).map(t=>'<p>'+esc(t)+'</p>').join('')}</details><div class="quiet-list">${s.life.knowledge.map(k=>`<details><summary>${esc(LIFE_LORE[k][0])}</summary><p>${esc(LIFE_LORE[k][1])}</p></details>`).join('')||'<p class="hint">世界背景先为你提供全貌；亲身经历与核实的线索，会逐项记在这里。</p>'}</div></section>`;}

function quietActionReceipt(s){const last=s.log.at(-1);if(!last||last.turn!==s.turn)return '';return `<div class="quiet-receipt" role="status"><span>最近结果</span><p>${esc(last.title)}</p>${dsHTML(last.ds.slice(0,3))}${button('完整反馈','lastResult','','text-button')}</div>`;}

// Forecasts execute the real action on a disposable copy: never write to the player's run.
function trainingForecast(s,id,ordinary=false){
 const copy=clone(s);if(ordinary)copy.systemIntro.step=4;
 const before=clone(copy),result=act(copy,id);if(!result.ok)return {ok:false,text:result.text,ds:[]};
 const ds=Object.keys(LIMITS).filter(k=>copy[k]!==before[k]).map(k=>[LABELS[k],copy[k]-before[k]]);
 for(const [k,label] of [['points','进化点'],['mastery','天赋熟练']])if(copy.talent[k]!==before.talent[k])ds.push([label,copy.talent[k]-before.talent[k]]);
 return {ok:true,ds,ap:before.ap-copy.ap,taskAdvanced:copy.systemIntro.step>before.systemIntro.step};
}
function forecastText(f){return f.ok?(f.ds.map(([n,v])=>n+' '+(v>0?'+':'')+v).join(' · ')||'当前状态已满，无额外恢复'):f.text;}
function briefingState(s){const copy=clone(s);if(!copy.talent.awake)effect(copy,{talent:{awaken:true}});return copy;}
function briefingAttributes(s){return `<dl class="growth-attributes">${[
 ['修为',s.xp,'身体训练的积累，用来达到下一境界的门槛。修炼增长最多，研习、战法和部分剧情也会增加。'],
 ['精神',s.mind,'每次突破都有精神要求；研习武道可以提升。'],
 ['战法',s.skill,'影响实战能力和部分考核资格；演练战法可以提升。'],
 ['情报',s.intel,'用于侦察、任务判断与部分反袭杀条件；研习和相关剧情可以积累。']
 ].map(([name,value,desc])=>`<div><dt>${name}<b>${value}</b></dt><dd>${desc}</dd></div>`).join('')}</dl><p class="brief-resource">精力 ${s.energy}/100 · 伤势 ${s.injury} · 资金 ${s.cash} 万 · 学分 ${s.credit} · 本期行动 ${s.ap}/3</p><p>精力是做事的体力，伤势会拖累实战，也会阻止突破或进化。资金用于购买物资；学分既能兑换，也要留给突破。每期三次行动，用完后推进时间。</p>`;}
function breakthroughLesson(s){const n=s.rank+1;if(n>=REALMS.length)return '<p>你已到达本作可修炼的最高境界。之后可以继续天赋蜕变、守备与结局目标。</p>';const miss=breakthroughMissing(s);return `<div class="brief-callout"><b>下一次武道突破：${REALMS[n]}</b><p>修为 ${s.xp}/${THRESHOLDS[n]} · 精神 ${s.mind}/${n*5} · 学分 ${s.credit}/${n+1} · 精力 ${s.energy}/25；伤势须 ≤35。</p><p>${esc(miss.length?'当前还缺：'+miss.join('；'):'条件已经齐备，可以在「角色 → 属性」突破。')}</p><small>成功时消耗 ${n+1} 学分、25 精力；保留修为，不消耗行动。更高境界还受当前主线阶段限制。</small></div>`;}
function systemLesson(s,view){const d=DESTINY_BY[s.talent.id],privateSystem=d.route==='underdog';
 if(!privateSystem)return `<p>你觉醒的是 <b>${GRADES[d.grade]} 级 ${d.name}</b>，走公开天才路线。这个角色没有私人系统，成长优势来自固定天赋：${d.gift}</p><p>你仍需亲自训练，完成培养任务来获取进化点。你的公开战绩会带来认可，也会提高曝光和被异族追踪的风险；敛息和反侦察可以降低压力，已经出现的袭杀仍须处理。</p><div class="brief-callout"><b>当前培养目标</b><p>${esc(currentTalentQuest(view)?.desc||'培养任务已完成，可继续处理机缘与袭杀。')}</p></div>`;
 const q=introMission(view),r=INTRO_REWARDS[0],first=clone(view);first.systemIntro.step=0;
 const descriptions={devour:'你每次修炼都会多获得 2 点天赋熟练。系统通过训练任务发放额外修为和进化点；当前玩法没有吞食物品直接换点的操作。',echo:'系统将练过的动作变成反馈。每次演练战法，额外增加 3 点战法、3 点天赋熟练；第二个新手任务也会要求演练战法。',shadow:'系统帮助你发现细节。每次研习额外增加 3 点情报；反侦察压低追踪热度的效果更强。第二个新手任务要求研习武道。'};
 return `<p>只有你能看见 <b>${d.system}</b>。${descriptions[d.id]}</p><p>普通训练的收益照常获得；完成指定任务后，系统再追加奖励。单纯反复修炼只会提升属性和熟练度，不会每次都掉落进化点。</p>${view.systemIntro.step===0?`<div class="brief-callout"><b>第一个任务：完成一次修炼淬体</b><p>额外奖励：修为 +${r.xp}、进化点 +${r.talent.points}、熟练 +${r.talent.mastery}、精力 +${r.energy}。</p><p>按${s.talent.awake?'你现在的状态':'初始状态觉醒后'}，这一次训练的合计净变化：${esc(forecastText(trainingForecast(first,'train')))}。</p><small>任务奖励只发一次；精力恢复仍受 100 上限限制。</small></div>`:`<div class="brief-callout"><b>${q?'当前新手任务：'+q.title:'新手阶段已完成'}</b><p>${esc(q?q.text:(currentTalentQuest(view)?.desc||'继续探索、处理袭杀与完成个人目标。'))}</p>${q?'<small>'+esc(q.reward)+'</small>':''}</div>`}<p>系统来源始终是秘密。选择藏拙时，真实评级可以高于公开档案；公开战绩可以改变他人的态度，也会让敌人更注意你。</p>`;
}
function evolutionLesson(s,view){const p=evolutionPlan(view),d=DESTINY_BY[s.talent.id];if(p.complete)return '<p>你的天赋已经完成 SSS 的三重蜕变。现在成长的重点，是尚未完成的境界、关系、守备与个人结局。</p>';
 return `<p><b>进化点</b>是要花掉的资源，来自指定任务、首领副本的首次通关、榜上挑战与成功反击袭杀；<b>熟练度</b>是练出来的积累，修炼、研习和战法演练都会增加。两者不能互相代替。</p><div class="brief-callout"><b>${p.targetLabel} · ${p.targetName}</b><p>${p.conditions.map(c=>(c.met?'✓ ':'○ ')+c.text).join(' · ')}</p><p>满足全部条件后，在「角色 → 进化」主动进化：花费 ${p.cost} 进化点，保留熟练，不占行动。</p><small>天赋进化后，修炼的评级加成从 ${p.currentTraining}% 提升到 ${p.nextTraining}%，天赋战力加成从 ${p.currentPower}% 提升到 ${p.nextPower}%。这不会自动提高武道境界。</small></div>${d.route==='underdog'&&view.systemIntro.step<4?`<ol class="brief-route"><li><b>修炼一次</b><span>得到训练收益与首个系统奖励，进化点 +${INTRO_REWARDS[0].talent.points}。</span></li><li><b>${introSecondAction(view)==='spar'?'演练战法':'研习武道'}一次</b><span>完成第二项任务，进化点 +${INTRO_REWARDS[1].talent.points}，开启同学验证剧情。</span></li><li><b>完成验证剧情</b><span>方平是这次见证训练变化的同学。决定公开或藏拙，再获 ${INTRO_REWARDS[2].talent.points} 点，累计 50 点。</span></li><li><b>第一次 D → C</b><span>需要 ${EVO_COST[0]} 点、${EVO_MASTERY[0]} 熟练、伤势 ≤35；普通初始状态按上述两次训练即可达到要求。进化后还会获得首轮系统奖励。</span></li></ol>`:`<p>接下来：${esc(evolutionTaskStep(view).reason)}</p>`}<p>以后每一段剧情都沿着这条线推进：看清眼前的条件与代价 → 决定争取什么、向谁公开实力 → 完成剧情并结算 → 根据还缺的条件安排训练。缺修为去修炼，缺精神去研习，缺进化点去看任务，受伤先休整。</p>`;
}
function growthBriefing(s,index,preview){const view=briefingState(s),o=ORIGINS.find(x=>x.id===s.origin),perk=PERKS.find(x=>x.id===s.perk),d=DESTINY_BY[s.talent.id];
 const titles=['先看清你现在的起点','普通训练，怎样改变你','属于你的成长优势','把成长变成下一次进化'];

function focusedAction(s,id,lesson=false){const g=ACTION_FOCUS[id],f=trainingForecast(s,id,lesson),main=f.ds.filter(([k])=>g.keys.includes(k)),extra=f.ds.filter(([k])=>!g.keys.includes(k));
 const mainText=main.length?forecastText({ok:true,ds:main}):f.ok?'当前主要属性已满':f.text;
 return `<div class="focused-action" data-action-focus="${id}">${lesson?`<h3>${g.title}</h3><p class="action-purpose">${g.purpose}</p><p class="action-use">${g.use}</p><p class="action-main">${esc(mainText)}</p><p class="action-cost">${actionCostText(s,id)}</p>`:`<button class="action" data-do="action" data-value="${id}" ${f.ok?'':'disabled'}><b>${g.title} · ${g.purpose}</b><small>${g.use}</small><span class="action-main">${esc(mainText)}</span><small>${actionCostText(s,id)}</small>${f.taskAdvanced?'<small class="action-task">同时完成当前系统任务</small>':''}</button>`}${extra.length?`<details class="action-details"><summary>${lesson?'附带成长':'附带成长与奖励'}</summary><p>${esc(forecastText({ok:true,ds:extra}))}</p></details>`:''}</div>`;

function choiceFocus(s,c){
 const verbs={xp:'积累修为',mind:'提升精神',skill:'提升战法',cash:'获取资金',credit:'获取学分',intel:'收集情报',rep:'提高名望',defense:'巩固防线',supply:'补充物资',rescue:'守护同伴',gear:'改善装备',energy:'恢复精力'};
 const positive=Object.entries(c.effect||{}).filter(([k,v])=>verbs[k]&&v>0).map(([k])=>verbs[k]);
 if(c.effect?.injury<0)positive.unshift('减轻伤势');
 if(!positive.length&&c.effect?.bonds)positive.push('维系人物关系');
 const focus=c.consequence||(c.lifeAction?ACTION_FOCUS[lifeAction(s,c)].purpose:positive.slice(0,2).join(' · ')||'决定接下来的故事走向');
 const costs=Object.entries(c.effect||{}).filter(([k,v])=>LABELS[k]&&(v<0&&k!=='injury'||k==='injury'&&v>0)).map(([k,v])=>LABELS[k]+(v>0?'+':'')+v);
 if(c.battle){const b=battlePreview(s,c.battle);costs.push('交锋胜率 '+b.p+'%；消耗 15 精力，失利增加 16 伤势、无战利品');}
 return focus+(costs.length?'。代价与风险：'+costs.join(' · '):'');
}

function martialView(s){const next=Math.min(10,s.rank+1),miss=breakthroughMissing(s);const qi=[120,180,300,700,1400,2400,5000,10000,30000,80000,160000][s.rank]+Math.floor(s.xp*.12);return `${talentPanel(s)}${panel('武道档案',PERKS.find(p=>p.id===s.perk).name,`<div class="row between"><h2 style="font-size:26px;color:#efcc7b">${REALMS[s.rank]}</h2><div><span class="small">战力指数</span> <b class="num" style="font-size:27px;color:#f1ca71">${power(s).toLocaleString()}</b></div></div><p class="hint">${REALM_DESC[s.rank]}</p><div class="statrow" style="margin-top:12px">${[['气血估值',qi],['精神',s.mind],['战法',s.skill],['装备',s.gear+'阶'],['伤势',s.injury]].map(([n,v])=>`<div class="stat"><label>${n}</label><span class="num">${v}</span></div>`).join('')}</div><p class="hint">气血估值与战力是游戏化指标；伤势会削弱实战表现。精力、战法与装备共同影响当前战力。</p>`)}${panel('下一次突破',s.rank<10?REALMS[next]:'继续探索更远的天地',`${meter('修为积累',Math.min(s.xp,THRESHOLDS[next]),THRESHOLDS[next])}<p class="hint">累计修为 ${s.xp}。修为不会在升品时扣除；突破消耗 ${next+1} 学分、25 精力，需精神 ${next*5}、伤势 ≤35，并符合主线阶段。</p>${button(s.rank>=10?'已达本作修炼上限':'尝试突破 · '+REALMS[next],'breakthrough','','btn pri next',miss.length>0)}${miss.length?`<p class="hint">${esc(miss.join('；'))}</p>`:'<p class="hint">所有条件已满足。本作突破采用明确条件，不额外抽取隐藏失败概率。</p>'}`,true)}${panel('武道长阶','已到达的境界会留下标记',`<div class="realm-grid">${REALMS.map((r,i)=>`<div class="realm-node ${i===s.rank?'on':i<s.rank?'done':''}">${r.replace(' · ','<br>')}</div>`).join('')}</div><p class="hint">一至三品淬骨；四品天地之桥与五脏，五品六腑与血肉经脉，六品三焦之门，七品精神具现，八品金身，九品本源，随后绝巅。</p><p class="hint">绝巅之后原著仍有帝级、圣人、天王与皇者。本作终局保留这些力量差距，玩家无法仅凭剧情进度跨级击败最高层敌人。</p>`,true)}${panel('当前战力如何计算','显示与探索交锋使用相同规则',`<p class="hint">境界基础 × 天赋评级与蜕变修正 × 战法修正（最多 +80%）× 装备修正（每阶 +5%）× 伤势修正 × 当前精力修正。</p><p class="hint">探索交锋时，已结识且好感 ≥40 的同伴各提供 4% 协作增益，上限 20%。这是情报与协作支持，不把低阶好友当成高阶战力。胜率限制在 5%–95%，选择前会显示具体数值。</p>`,true)}`;}
function bagView(s){return `${panel('随身行囊','物资即时使用，不消耗月度行动',`<div class="cardlist">${[['pill','恢复药剂','精力 +30 · 伤势 −5'],['training','淬炼资源配额','修为 +45'],['med','疗伤药剂','伤势 −25']].map(([id,name,desc])=>`<article class="item-card"><div class="row between"><h3>${name} × ${s.bag[id]}</h3>${button('使用','use',id,'btn sm',!s.bag[id]||(id==='med'&&!s.injury)||(id==='pill'&&s.energy===100&&!s.injury))}</div><p>${desc}</p></article>`).join('')}</div><div class="feedback" role="status">${esc(s.feedback)}</div>`)}${panel('资源兑换处','当前学分 '+s.credit+ (s.origin==='craft'?' · 工匠兵器七五折':''),`<div class="cardlist">${GOODS.map(g=>{const m=buyMissing(s,g);return `<article class="item-card"><div class="row between"><h3>${g.name}</h3><span class="badge">${price(s,g)} 学分</span></div><p>${g.desc}</p><div class="row between">${button(g.gear?'兑换并装备':'兑换一份','buy',g.id,'btn sm',m.length>0)}<small>${esc(m.join('；'))}</small></div></article>`}).join('')}</div>`)}${panel('账目说明','钱与学分有不同来源',`<p class="hint">资金用于家用、助学和部分机缘。学分用于校内资源与突破。筹资行动两者都可获得；入学后每期固定学分 +4，资金 +3万。当前装备 ${s.gear} 阶，同级装备不会反复叠加。</p>`,true)}`;}
function chanceView(s){const list=OPPORTUNITIES.filter(q=>q.place===s.place);return `${panel('行路地图','当前所在 · '+s.place,`<div class="map"><div class="map-title">人间 / 地窟 · 行程示意</div><div class="map-grid">${LOCATIONS.map(l=>`<button class="map-node ${s.place===l.id?'current':''} ${chapter(s)<l.stage?'lock':''}" data-do="travel" data-value="${l.id}" ${chapter(s)<l.stage?'disabled':''}>${l.id}<small>${chapter(s)<l.stage?'第 '+(l.stage+1)+' 卷开放':l.note}</small></button>`).join('')}</div></div><p class="hint">点击已开放地点安排行程，不额外扣行动；一次探索消耗 1 次行动。每处机缘仅结算一次。剧情事务可通过信件或会面推进，与探索所在地分别记录。</p>`)}${panel(s.place+' · 可寻之缘','不随刷新或读档重新生成',`<div class="cardlist">${list.map(q=>{const m=opportunityMissing(s,q),done=s.done.includes(q.id);return `<article class="item-card"><div class="row between"><h3>${q.name}</h3><span class="badge">${done?'已记入纪事':'探索 · 1 行动'}</span></div><p>${q.desc}</p>${button(done?'已经历':'前去探寻','explore',q.id,'btn sm',m.length>0)}${!done&&m.length?`<p class="hint">${esc(m.join('；'))}</p>`:''}</article>`}).join('')||'<div class="empty">此处暂时没有独立机缘，可前往其他地点。</div>'}</div>`)}<div class="paper"><p class="hint">全图 ${OPPORTUNITIES.length} 处机缘 · 已经历 ${OPPORTUNITIES.filter(q=>s.done.includes(q.id)).length} 处。未完成机缘会保留，可在后续补足条件再来。</p></div>`;}
function worldViewHTML(s){const selector=`<div class="row">${[['people','人物往来'],['world','人间局势'],['log','人生纪事']].map(([k,t])=>button(t,'worldView',k,'btn '+(worldView===k?'pri':''))).join('')}</div>`;let body='';
 if(worldView==='people')body=panel('故人与同行','拜访消耗 1 行动、10 精力；每人每期一次',`<div class="npc-grid">${NPCS.map(n=>{const locked=chapter(s)<n.stage,m=visitMissing(s,n),b=s.bonds[n.id]||0;return `<article class="npc-card"><div class="row between"><h3>${locked?'尚未结识':n.id}</h3><span class="badge">${locked?'第 '+(n.stage+1)+' 卷':b>=40?'信任':b>0?'相识':b<0?'隔阂':'初识'}</span></div><small>${locked?'随剧情逐步登场':PERSON_INTROS[n.id].identity}</small><p>${locked?'向前走，才会遇见更远处的人。':n.desc}</p>${locked?'':`<p>${PERSON_INTROS[n.id].relationship}。${PERSON_INTROS[n.id].purpose}。</p><p class="npc-reaction">${esc(talentSocial(s,n))}</p><div class="row between"><small>关系 ${b} / 100</small><small>${b>=40?'提供协作支持':'好感 40 解锁协作'}</small></div><div class="progress"><i style="width:${clamp(b,0,100)}%"></i></div>`}${button(locked?'尚未登场':s.visits.includes(n.id)?'本期已拜访':'拜访交流','visit',n.id,'btn sm',m.length>0)}${!locked&&m.length?`<p class="hint">${esc(m.join('；'))}</p>`:''}</article>`}).join('')}</div><div class="feedback" role="status">${esc(s.feedback)}</div>`);
 else if(worldView==='world')body=`${panel('人间局势','你的选择留下的共同状态',`<div class="worldstats">${[['防线',s.defense,'组织、轮换与应战准备'],['补给',s.supply,'物资与运输的韧性'],['守护',s.rescue,'救援、遗属与民生贡献'],['情报',s.intel,'核验过的线索与联络']].map(([n,v,d])=>`<div class="worldstat"><small>${n}</small><b>${v}</b><small>${d}</small></div>`).join('')}</div><p class="hint">进入地窟后，每期防线自然承压 −2；补给低于 10 时额外 −3。守备、剧情选择与机缘可以改善。高境界本身不会自动修复公共防线。</p>`,true)}${panel('已经改变的事','后续剧情从这些事实继续',`<div class="timeline">${worldFacts(s).map(([t,d])=>`<div class="timeline-item"><b>${t}</b><p>${d}</p></div>`).join('')||'<p class="hint">第一项改变，会从你作出的选择开始。</p>'}</div>`,true)}${panel('十二卷路标','尚未走到的章节只显示主题',`<div class="timeline">${CHAPTERS.map((c,i)=>`<div class="timeline-item"><b>${String(i+1).padStart(2,'0')} · ${c[0]} ${i===chapter(s)?'◂ 当前':''}</b><p>${i<=chapter(s)?c[1]+' · '+c[2]:'尚未经历'}</p></div>`).join('')}</div>`,true)}`;
 else body=panel('人生纪事','已结算文本与数值保留原时刻快照',`<p class="hint">共 ${s.log.length} 条记录。此页展示最近 100 条；完整记录包含在导出存档中。</p>${[...s.log].reverse().slice(0,100).map(l=>`<details class="logdetails"><summary>第 ${l.turn+1} 期 · ${esc(l.title)} <span class="badge">${esc(l.type)}</span></summary>${paras(l.text)}${dsHTML(l.ds)}</details>`).join('')||'<div class="empty">故事尚未落笔。</div>'}`,true);
 return selector+body;
}
function worldFacts(s){const f=s.flags,a=[];if(s.talent.awake){a.push(['天赋 · '+GRADES[s.talent.grade]+'级 '+talentName(s),'公开评级 '+GRADES[s.talent.publicGrade]+'；完成任务 '+s.talent.claimed.length+'/6；击退袭杀 '+s.talent.count.huntWin+' 次、撤离 '+s.talent.count.huntEscape+' 次。']);}if(f.exam_passed)a.push(['武考已完成','你通过气血、专业与文化考核的游戏化流程，获得魔武入学机会。']);if(s.mentor!=='尚未择师')a.push(['师承 · '+esc(s.mentor),'你的导师选择已经记录，后续往来从此开始。']);if(f.team_saved)a.push(['一支小队回到了希望城','救援保留了人员，后续可以补充侦察与守备。']);if(f.team_partial)a.push(['接应带回了部分队员','部分人仍在恢复，前线不会凭空拥有完整增援。']);if(f.team_lost)a.push(['未归的小队','这支队伍没有完整归来；后续处理查询、善后与防线缺口。']);if(f.local_truce)a.push(['有限的地方停火','协议仅覆盖约定边界；不代表人族与全部地窟势力永久和平。']);if(f.durable_truce)a.push(['停火持续获得核验','终局将承认这段边界的变化，不强制重演旧定战争。']);if(f.supply_route)a.push(['稳定运输线','每期额外补给 +3，路线也会提出维护需求。']);if(f.public_manual||f.manual_shared_late)a.push(['公共战法课程','你的经验已经进入公共课程，低品学生会继续反馈问题。']);if(f.teaching_debt)a.push(['外派教学承诺',f.teaching_paid?'承诺已履行，地方合作得以继续。':'尚未兑现，后续会收到履约请求。']);if(f.school_built)a.push(['故乡的武馆','助学与课程成为你留给后来者的起点。']);if(f.trap_known||f.truth_backup)a.push(['源地风险档案','风险线索经过整理；它不是允许低阶玩家越级击败皇者的凭证。']);if(f.succession_ready)a.push(['可接替的岗位','接替者有明确权限，组织开始减少对个人的依赖。']);return a;}
function gameView(s){if(narrativeActive(s))return story(s);if(tab==='frontier')return frontierHub(s);const views={season:seasonView,martial:characterView,arrange:arrangementView,more:moreView,notebook:notebookView,bag:bagView,chance:chanceView,world:worldViewHTML},view=views[tab]||seasonView;return `<div class="col">${hud(s)}<main class="field" id="tabbody">${['bag','chance','world'].includes(tab)?button('‹ 返回更多','tab','more','text-button'):''}${view(s)}</main>${dock()}</div>`;}

function guide(){modal('设定与玩法',`<p class="lead-quote">你可以走得很远，也要决定为谁留下路。</p><p class="hint">无需读过原著。新开局先从阳城的生活开始；联合备考、城中人物与资助席选拔为原创改编。去一处地方，会使用本期的一次行动并留下关系或准备，训练和系统任务同步推进。三期后资助席关闭，放弃不影响正常武考。新生活剧情把情境与决定放在同一页，减少无意义翻页；剧情期间仍不显示成长面板。首次登场会介绍人物身份、关系与来意，剧情以分幕对话演出；人物介绍、场景、选择与结果分别翻页，可跳至选择。所有待处理剧情完成后，才显示数值结算、天赋进度与自由行动；触发新剧情时会重新进入阅读页。先选择角色：角色自带固定命格、系统与成长路线，无须另选天赋。D级角色觉醒后，本期页直接显示新手系统：修炼一次拿奖励、再练一次解锁与方平的验证、随后完成首轮进化。之后到「角色 → 任务」继续六阶段长期任务。D 级系统宿主可以藏拙进化或公开反转；S—SSS 天才更快成长，也会因曝光持续进入猎杀名单。每期 3 次行动，36 期完成十二卷。剧情选择本身不扣行动；选项前置和资源成本直接显示。修炼达到修为、精神、学分等条件后，到「角色 → 属性」主动突破。</p><p class="hint">「更多」中可以打开行囊兑换、地图探索、人物往来、完整纪事与世界见闻。每个选项先显示结果，点击继续才翻到下一件事。</p><p class="hint">原著框架：阳城武考、魔都武大、学分兑换、地窟与王庭、淬骨至本源的修炼体系。玩家是同期原创角色；方平保留其原著身份与独有系统。本次新增 D—SSS 觉醒评级、可进化天赋、三种私人系统与异族定点袭杀，均为你指定的改编设定；方平的原著财富系统仍属于方平。</p><p class="hint">改编范围：对白和支线为原创，主线大事件作阶段化取材，不复述原著逐章情节。时间压缩为三年 36 期；价格、修为阈值、气血估值、胜率及结局为游戏规则。十二卷触及源地，但不宣称覆盖原著全部皇者、天帝和种子终局。</p><div class="bookline">设定查阅：${SOURCES.map(([n,u])=>`<a class="linklike" href="${u}" target="_blank" rel="noopener noreferrer">${n}</a>`).join(' · ')}</div><p class="hint">键盘：1 / 2 / 3 选择剧情，Enter 翻到下一页或确认结果，Esc 关闭弹窗。存档保存在本机浏览器，可导出迁移。</p>`)}

function runAction(fn){const receipt=JSON.stringify(DB.run?.systemIntro.last),before=DB.run?{points:DB.run.talent.points,mastery:DB.run.talent.mastery,grade:DB.run.talent.grade,ascension:DB.run.talent.ascension,rank:DB.run.rank}:null,anchor=interactionAnchor,top=anchor?document.querySelector('[data-anchor="'+anchor+'"]')?.getBoundingClientRect().top:null;const r=fn();rewardAnimation=receipt!==JSON.stringify(DB.run?.systemIntro.last);if(!r.ok){toast(r.text||'暂时不能执行');return r;}const t=DB.run.talent,p=evolutionPlan(DB.run);if(before&&p.awake&&(t.points!==before.points||t.mastery!==before.mastery||t.grade!==before.grade||t.ascension!==before.ascension||DB.run.rank!==before.rank)){DB.run.feedback+='\n天赋进度：'+(p.complete?'三重蜕变已圆满':(t.grade!==before.grade||t.ascension!==before.ascension?'本次进化完成；下一目标 '+p.targetLabel+'。':'目标 '+p.targetLabel+'。')+'进化点 '+t.points+'/'+p.cost+'，熟练 '+t.mastery+'/'+p.mastery+'。'+(p.ready?'全部条件已满足，可进化。':''));}persist();render();if(top!==null&&top!==undefined){const el=document.querySelector('[data-anchor="'+anchor+'"]');if(el)window.scrollBy(0,el.getBoundingClientRect().top-top);}return r;}

 if(p.complete)return `<section class="panel evolution-panel" data-anchor="evolution"><h2>SSS · 三重蜕变已圆满</h2><p class="hint">当前天赋 ${esc(talentName(s))}。剩余进化点 ${s.talent.points}、熟练 ${s.talent.mastery}，后续可继续探索与经营关系。</p>${button(step.label,step.action,step.value,'btn sm')}</section>`;
 const bars=p.conditions.slice(0,2).map(c=>{const percent=Math.min(100,Math.floor(c.value/c.need*100));return `<div class="evo-resource"><div class="row between"><b>${c.label}</b><span>${c.value} / ${c.need}</span></div><div class="progress" role="progressbar" aria-label="${c.label}" aria-valuemin="0" aria-valuemax="${c.need}" aria-valuenow="${Math.min(c.value,c.need)}"><i style="width:${percent}%"></i></div><small>${c.met?'已满足':`还差 ${c.remaining}`} · ${percent}%</small></div>`}).join('');
 return `<section class="${detailed?'evolution-detail':'panel evolution-panel'}" data-anchor="evolution" aria-label="天赋进化进度"><div class="row between"><div><div class="section-label">下一次天赋进化</div><h2>${p.targetLabel} <span class="evo-form">${esc(p.targetName)}</span></h2></div><span class="badge ${p.ready?'evo-ready':''}">${p.ready?'可进化':p.conditions.filter(c=>c.met).length+' / 4 项条件已满足'}</span></div><p class="hint">当前 ${GRADES[s.talent.grade]} 级 · 公开档案 ${GRADES[s.talent.publicGrade]} 级 · ${s.talent.mode==='hidden'?'保留底牌':'公开成长'} · 猎杀热度 ${s.talent.heat}/100</p><div class="evo-resources">${bars}</div><div class="evo-gates"><span class="${p.conditions[2].met?'met':'unmet'}">${p.conditions[2].met?'✓':'◇'} 境界：${REALMS[s.rank]} / 需${REALMS[p.rank]}</span><span class="${p.conditions[3].met?'met':'unmet'}">${p.conditions[3].met?'✓':'◇'} 伤势：${s.injury} / ≤35</span></div><p class="evo-benefit">进化收益：训练修为加成 ${p.currentTraining}% → ${p.nextTraining}% · 天赋战力加成 ${p.currentPower}% → ${p.nextPower}%</p><div class="evo-next"><div><b>下一步</b><p>${esc(step.reason)}</p></div>${button(step.label,step.action,step.value,'btn pri sm')}</div><p class="hint">进化点来自任务与袭杀奖励；熟练度来自训练。进化扣点、保留熟练，进阶后显示下一阶目标。</p>${detailed?`<p class="hint">当前真实评级 ${GRADES[s.talent.grade]}，公开档案 ${GRADES[s.talent.publicGrade]}。${s.talent.mode==='hidden'?'进化会继续保留底牌。':'公开成长会带来更多关注。'}</p>`:''}</section>`;
}
function longQuestPanel(s){const q=currentTalentQuest(s),i=s.talent.claimed.length,step=evolutionTaskStep(s);if(!q)return panel('成长任务','六阶段已完成',`<p class="hint">长期任务已完成。天赋的下一次蜕变条件见上方进度，尚未经历的机缘仍可探索。</p>`);const missing=talentQuestMissing(s,i);return panel(isGenius(s)?'当前培养任务':'当前系统任务',`${i+1} / 6 · ${q.title}`,`<p>${q.desc}</p><div class="quest-rewards"><span>进化点 +${q.points}</span><span>熟练 +${q.mastery}</span></div><div class="quest-checks">${missing.length?missing.map(m=>'<p>◇ '+esc(m)+'</p>').join(''):'<p>✓ 条件齐备，完成考核剧情后到账。</p>'}</div><div class="row">${button(step.label,step.action,step.value,'btn pri')}${button('查看完整任务路线','taskRoad','','btn')}</div><p class="hint">${esc(step.reason)}</p><div class="feedback" role="status">${esc(s.feedback)}</div>`);}
function focusSection(name){document.querySelector('[data-anchor="'+name+'"]')?.scrollIntoView({block:'start',behavior:'auto'});}
</script></body></html>
