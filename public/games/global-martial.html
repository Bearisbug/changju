<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4a1709"><title>全球高武·人间万相</title><style>
/* 视觉语言：深褐描金的像素边框 + 米黄壁纸。边框由 JS 生成的 9-slice SVG（--fr-*）绘制，
   文字色随所在表面切换：深色表面（面板/按钮/选项）与纸面（剧情卡/弹窗/卡片）各有一套 token。 */
:root{
  --mar-0:#1b0602;--mar-1:#2b0b04;--mar-2:#4a1709;--mar-3:#5a1e0c;--mar-4:#71301a;
  --gold-0:#a8701f;--gold-1:#e3aa45;--gold-2:#f6d27a;
  --cream:#fbf2c8;--paper:#f6e7bb;--ink:#3a170a;
  --r-white:#f3efe2;--r-yellow:#eebd2c;--r-purple:#9160d6;--r-black:#141016;--r-red:#d8382a;--r-gold:#f7d266;
  --f-disp:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Jersey 10","Noto Sans SC",ui-monospace,monospace;
  --col:760px;--dock-h:64px;
  color-scheme:light;
}
.panel,.hud,.dock,.opt,.btn,.vbar,.toast,.flash{
  --fg:#f8e9c6;--dim:#dcb994;--faint:#a88566;--line:#6d3118;--line-2:#8c4a26;
  --gold:#f2c35e;--red:#ff9178;--jade:#a6df8d;--blue:#9cc0ff;
  --panel:#3a1208;--panel-2:#2e0d05;--gold-bg:rgba(242,195,94,.13);--bg:#2b0b04;--track:#220803;--ring-ol:rgba(255,236,200,.3);
  --t-fei:#9b8f86;--t-xia:#cbbca9;--t-zhong:#9fd58d;--t-shang:#93bbff;--t-ding:#d3a6ff;--t-ji:#ffb067;--t-shen:#ffe07a;
  color:var(--fg);
}
.field,.paper,.story,.modal .box,.tile,.idc,.perk,.slot,.fcard,.seg button{
  --fg:#3a170a;--dim:#6b4428;--faint:#97714f;--line:#d6b26f;--line-2:#c09650;
  --gold:#9a5806;--red:#ad2f1c;--jade:#2b7434;--blue:#2f5fae;
  --panel:#fbf1d2;--panel-2:#f0dca9;--gold-bg:rgba(200,140,30,.13);--bg:#f6e7bb;--track:#dcc289;--ring-ol:rgba(58,23,10,.38);
  --t-fei:#857a70;--t-xia:#77685a;--t-zhong:#3a8637;--t-shang:#2c5fb6;--t-ding:#7a3fc2;--t-ji:#c25c0c;--t-shen:#a07400;
  color:var(--fg);
}

*{box-sizing:border-box}
html{background:var(--mar-0);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--f-ui);font-size:14px;line-height:1.6;color:var(--ink);background-color:var(--mar-0);background-image:var(--wall-dark);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px dashed var(--gold-2);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--f-serif);font-weight:900;line-height:1.3;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-size:1.22em;line-height:1;letter-spacing:.03em}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12.5px}
.px{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
[hidden]{display:none!important}

/* ---------- 版心 ---------- */
.col{position:relative;width:min(var(--col),100%);margin:0 auto;min-height:100vh;background-color:var(--cream);background-image:var(--wall);border-inline:4px solid #cdc58e;box-shadow:0 0 0 4px var(--mar-1);padding-bottom:calc(var(--dock-h) + 28px + env(safe-area-inset-bottom,0px))}
.col.bare{padding-bottom:28px}
.field{display:grid;gap:14px;padding:14px 8px 6px;align-content:start}
@media (min-width:560px){.col{border-inline-width:6px}.field{padding:18px 16px 8px;gap:16px}}

/* ---------- 表面：面板 / 纸 / 剧情卡 ---------- */
.panel{position:relative;min-width:0;background:var(--mar-2);background-clip:padding-box;border:9px solid transparent;border-image:var(--fr-panel) 9 / 9px stretch;padding:4px 6px 8px}
.ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding:2px 0 6px;margin-bottom:12px;border-bottom:4px solid #efdaa4;list-style:none}
.ph::-webkit-details-marker{display:none}
.ph h2{font-size:19px;letter-spacing:.06em;color:var(--fg)}
.ph .sub{font-size:12.5px;color:var(--dim)}
.ph .rt{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--dim)}
.paper{background:var(--paper);background-clip:padding-box;border:6px solid transparent;border-image:var(--fr-paper) 6 / 6px stretch;padding:10px 12px}
.story{position:relative;min-width:0;background:var(--paper);background-clip:padding-box;border:12px solid transparent;border-image:var(--fr-gold) 12 / 12px stretch;padding:10px 12px 14px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
.sec-t{font-size:12px;letter-spacing:.14em;color:var(--faint);margin:0 0 6px}

/* ---------- 抬头 HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:var(--mar-2);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;box-shadow:inset 0 -3px 0 var(--mar-4),0 4px 0 var(--mar-0)}
.hud-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.avatar{width:58px;height:58px;background:#1a0602;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-gbtn) 4 / 4px stretch}
.avatar svg{display:block;width:100%;height:100%}
.avatar.lg{width:84px;height:84px}
.hud-name{font-family:var(--f-serif);font-weight:900;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-sub{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-date{font-size:12px;color:var(--faint)}
.hud-date .num{color:var(--gold-2);font-size:16px}
.hud-btns{display:flex;gap:6px}
.hud-k{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:10px -12px 0;background:var(--mar-1);border-top:2px solid var(--mar-1)}
.k{display:flex;flex-direction:column;align-items:center;padding:4px 2px 7px;background:var(--mar-2);min-width:0}
.k small{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);white-space:nowrap}
.k small .px{width:11px;height:11px;color:var(--gold-1)}
.k b{font-family:var(--f-num);font-size:23px;font-weight:400;letter-spacing:.03em;color:var(--gold-2);line-height:1.05}
.k.warn b{color:#ff8a70}
.k.bump b{animation:bump .7s ease}

/* ---------- 五维（参照「学识/慷慨…」那一排） ---------- */
.vbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--mar-2);background-clip:padding-box;border:9px solid transparent;border-image:var(--fr-panel) 9 / 9px stretch;padding:0 0 2px}
.v{display:flex;flex-direction:column;align-items:center;min-width:0}
.v .pips{display:flex;gap:1px;height:9px;align-items:center}
.v .pips i{width:5px;height:5px;margin:0 1px;transform:rotate(45deg);background:#64301a}
.v .pips i.on{background:#ffe066}
.v .px{width:30px;height:30px;margin:3px 0 1px;color:#d8ccb8}
.v.hi .px{color:var(--gold-2)}
.v b{font-size:13px;letter-spacing:.12em;line-height:1.3}
.v .num{font-size:19px;color:var(--gold-2);line-height:1}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:3px 14px;background:var(--mar-3);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-btn) 4 / 4px stretch;font-weight:700;letter-spacing:.08em;white-space:nowrap;user-select:none;transition:transform .1s ease,filter .12s ease}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.42;filter:grayscale(.6)}
.btn.pri{background:var(--gold-1);border-image-source:var(--fr-gbtn);--fg:#3a1505;--dim:#6b3a12;--faint:#8a5a2a;color:#3a1505}
.btn.sm{min-height:32px;padding:1px 10px;font-size:13px;letter-spacing:.04em}
.btn.big{min-height:52px;padding:4px 30px;font-size:17px}
.btn.sq{width:40px;padding:0}
.btn.sq .px{width:18px;height:18px}
.btn s{font-weight:400;opacity:.7}
.modal .box > .btn:last-child{justify-self:stretch}

/* ---------- 标签 ---------- */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1.55;padding:0 6px;border:1px solid var(--line-2);color:var(--fg);white-space:nowrap;font-weight:500}
.chip.gold{color:var(--gold);border-color:currentColor;background:var(--gold-bg)}
.chip.red{color:var(--red);border-color:currentColor}
.chip.jade{color:var(--jade);border-color:currentColor}
.chip.faint{color:var(--faint);border-style:dashed}
.tier{font-weight:700}
.tier-废{color:var(--t-fei)}.tier-下{color:var(--t-xia)}.tier-中{color:var(--t-zhong)}.tier-上{color:var(--t-shang)}.tier-顶{color:var(--t-ding)}.tier-极{color:var(--t-ji)}.tier-神{color:var(--t-shen)}.tier-空{color:var(--faint)}
.bt{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:0 6px;line-height:18px;white-space:nowrap;border:1px solid currentColor}
.bt.t2{background:#15161b;color:#ecebe6;border-color:#6b6f7c}
.bt.t4{background:linear-gradient(90deg,#b8862b,#f3d27a,#b8862b);color:#2a1b00;border-color:#f3d27a}

/* ---------- 剧情卡 ---------- */
.flag{position:absolute;top:-17px;right:4px;z-index:2;display:flex;flex-direction:column;align-items:center;width:48px;pointer-events:none}
.flag .rod{width:46px;height:6px;background:#1d0b06;box-shadow:inset 0 -2px 0 #000}
.flag .ban{width:26px;height:38px;margin-top:-1px;padding-top:6px;display:grid;justify-items:center;align-content:start;background:var(--flag,#3d7a45);color:#fff4d8;font:400 22px/1 var(--f-num);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);box-shadow:inset 3px 0 0 rgba(255,255,255,.18);transform-origin:top center;animation:sway 3.2s ease-in-out infinite}
.flag .lab{margin-top:1px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--flag,#3d7a45)}
.story-k{font-size:12px;color:var(--faint);letter-spacing:.06em;padding-right:54px}
.story-t{font-size:22px;letter-spacing:.03em;margin:2px 0 10px;padding-right:54px}
.tx{font-family:var(--f-serif);font-size:15.5px;line-height:1.9;white-space:pre-line;color:var(--fg)}
.tx.ps{white-space:normal}
.tx.ps p + p{margin-top:.7em}
.story .tx{border-top:3px solid var(--line);padding-top:10px}
.story-left{margin-top:10px;font-size:12.5px;color:var(--faint);text-align:center;letter-spacing:.08em}
.echo{font-size:13px;line-height:1.7;color:var(--gold);background:var(--gold-bg);border-left:3px solid currentColor;padding:6px 10px;margin:8px 0}
.echo.mem,.echo.dim{color:var(--dim);background:transparent}
.echo.warn{color:var(--red);background:rgba(200,50,30,.09)}
.res{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:3px dashed var(--line);animation:fadeUp .35s both}
.res .pick{font-size:13px;color:var(--dim)}
.res .pick .ok{color:var(--jade)}.res .pick .bad{color:var(--red)}
.res .rt{font-family:var(--f-serif);font-size:15px;line-height:1.85}
.res .note{font-size:12.5px;color:var(--faint)}
.res-go{display:flex;justify-content:flex-end;margin-top:4px}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.delta{display:inline-flex;align-items:center;font-size:12px;line-height:1.55;padding:0 7px;border:1px solid var(--line-2);color:var(--fg);animation:pop .32s both;animation-delay:calc(var(--i,0) * 45ms)}
.delta.up{color:var(--jade);border-color:currentColor;background:rgba(80,170,80,.10)}
.delta.dn{color:var(--red);border-color:currentColor;background:rgba(200,60,40,.08)}
.alog .delta{animation:none}

/* ---------- 选项（深色木牌） ---------- */
.opts{display:grid;gap:10px}
.story .opts{margin-top:14px}
.opt{position:relative;display:grid;gap:3px;width:100%;text-align:left;background:var(--mar-3);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-plank) 4 / 4px stretch;padding:8px 12px 9px;transition:transform .12s ease,filter .12s ease}
button.opt:hover:not(:disabled){border-image-source:var(--fr-plank-hi);background:#68250f;transform:translateX(3px)}
button.opt:active:not(:disabled){transform:translate(3px,2px)}
.opt:disabled{filter:grayscale(.55) brightness(.92);opacity:.6}
.opt .t{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:700;font-size:15px;line-height:1.45;padding-right:18px}
.opt .t .px{color:var(--gold)}
.opt .m{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;line-height:1.55;color:var(--dim)}
.opt .m.hint{font-family:var(--f-serif)}
.opt.tm{border-image-source:var(--fr-plank-hi);background:#6a2a0e}
.opt.alter{background:#64190f}
.opt.alter::after{content:"";position:absolute;left:-4px;top:-4px;bottom:-4px;width:4px;background:#e0412c}
@media (hover:hover){
  .story,.modal .box{counter-reset:opt}
  .story button.opt:not(:disabled),.modal button.opt:not(:disabled){counter-increment:opt}
  .story button.opt:not(:disabled)::before,.modal button.opt:not(:disabled)::before{content:counter(opt);position:absolute;top:7px;right:8px;padding:1px 4px;font:400 13px/1 var(--f-num);color:var(--faint);border:1px solid var(--line-2)}
}

/* ---------- 要务告示 ---------- */
.notice{display:grid;gap:8px}
.notice .kick{text-align:center;font-size:12px;letter-spacing:.4em;color:var(--faint)}
.notice-h{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--gold-0)}
.notice-h .px{width:16px;height:16px;color:var(--gold-0)}
.notice h3{font-size:19px;letter-spacing:.06em}
.notice p{font-family:var(--f-serif);font-size:14.5px;line-height:1.8}
.notice .rumor{font-size:13.5px;color:var(--dim);border-left:3px solid var(--line-2);padding-left:8px}
.notice .tip{font-family:var(--f-ui);font-size:12.5px;color:var(--faint)}
.notice-go{display:flex;justify-content:flex-end}

/* ---------- 行动 ---------- */
.ap{display:inline-flex;gap:3px;align-items:center}
.ap .px{width:22px;height:22px}
.ap .px.on{color:var(--gold-2);filter:drop-shadow(0 0 4px rgba(246,210,122,.55))}
.ap .px.off{color:#6e3520}
.ag + .ag{margin-top:12px}
.ag-t{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.3em;color:var(--dim);margin-bottom:6px}
.ag-t::after{content:"";flex:1;height:2px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.tile{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;min-height:58px;padding:5px 8px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;transition:transform .12s ease,filter .12s ease}
.tile .ic{grid-row:1 / span 2;display:grid;place-items:center;width:32px;height:32px;background:var(--mar-2);color:var(--gold-2);box-shadow:inset 0 0 0 2px #2a0b04}
.tile .ic .px{width:20px;height:20px}
.tile b{align-self:end;font-size:14.5px;line-height:1.25}
.tile .d{align-self:start;font-size:11.5px;line-height:1.35;color:var(--dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{opacity:.46;filter:grayscale(.7)}
.tile.hot{background:#fde6a0;border-image-source:var(--fr-tile-hot)}
.tile.hot .ic{background:#8a3a10}
.tile.rec{animation:glow 1.8s ease-in-out infinite}
.tile.rec::after{content:"荐";position:absolute;top:-11px;right:-8px;width:22px;height:22px;display:grid;place-items:center;background:#b5341f;color:#fff2d6;font-family:var(--f-disp);font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff2d6,0 0 0 4px #b5341f;transform:rotate(8deg)}
.act-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.alog{display:grid;gap:10px}
.alog > div{display:grid;gap:4px;padding-left:10px;border-left:3px solid var(--line-2);font-size:13.5px}
.alog p{font-family:var(--f-serif);line-height:1.75}
.alog .when{font-size:12px;color:var(--gold)}

/* ---------- 底部页签（参照「探索/总览/酒馆」） ---------- */
.dock{position:fixed;left:50%;bottom:0;z-index:30;transform:translateX(-50%);width:min(var(--col),100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:0 3px env(safe-area-inset-bottom,0px);background:var(--mar-1);box-shadow:0 -4px 0 var(--gold-1),0 -7px 0 var(--mar-0)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--dock-h);background:#3a1107;color:var(--faint);font-size:13px;letter-spacing:.14em;transition:transform .15s ease,color .15s ease}
.dock button .px{width:22px;height:22px}
.dock button[aria-selected="true"]{z-index:1;height:calc(var(--dock-h) + 10px);transform:translateY(-10px);margin-bottom:-10px;background:var(--mar-2);color:var(--gold-2);clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% 100%,0 100%);box-shadow:inset 0 4px 0 var(--gold-1),inset 4px 0 0 var(--gold-1),inset -4px 0 0 var(--gold-1)}
@media (min-width:480px){.dock button span::before,.dock button span::after{content:"◆";display:inline-block;font-size:7px;vertical-align:3px;margin:0 5px;opacity:.55}}
.dock .dot{position:absolute;top:9px;left:calc(50% + 9px);width:8px;height:8px;background:#e5432f;box-shadow:0 0 0 2px #3a1107}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(22,6,2,.66);animation:fade .18s both}
.modal .box{position:relative;width:min(600px,100%);max-height:min(88vh,920px);overflow:auto;overscroll-behavior:contain;display:grid;gap:12px;align-content:start;background:var(--paper);background-clip:padding-box;border:12px solid transparent;border-image:var(--fr-gold) 12 / 12px stretch;padding:10px 12px 14px;animation:sheetIn .3s cubic-bezier(.2,.8,.2,1) both}
.modal .box > .sec-t:first-child{margin:0}
.modal .box h3{font-size:20px;letter-spacing:.03em;padding-bottom:8px;border-bottom:3px solid var(--line)}
.modal .box > p.dim{font-size:13px}
.modal .box .tx{font-size:15px;line-height:1.85}
@media (max-width:640px){.modal{align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.modal .box{max-height:90vh}}

/* ---------- 决斗 ---------- */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;background:var(--mar-2);color:#f8e9c6;box-shadow:inset 0 0 0 3px var(--mar-0),inset 0 0 0 5px var(--gold-0)}
.vs-side{display:grid;gap:1px;min-width:0}
.vs-side.r{text-align:right;justify-items:end}
.vs-side b{max-width:100%;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-side small{font-size:11.5px;color:#dcb994}
.vs .pw{font-size:23px;color:var(--gold-2)}
.vs .pips{display:flex;gap:6px;padding:3px}
.vs .pips i{width:10px;height:10px;transform:rotate(45deg);background:#2a0b04;box-shadow:inset 0 0 0 2px #8c4a26}
.vs .pips i.on{background:var(--gold-2);box-shadow:none}
.vs-mid{font-family:var(--f-disp);font-size:26px;line-height:1;color:var(--gold-2);padding:0 4px}
.dlog{display:grid;gap:4px;font-size:13.5px}
.dlog > div{padding:6px 8px;border-left:4px solid var(--jade);background:rgba(80,170,80,.08)}
.dlog > div.l{border-left-color:var(--red);background:rgba(200,60,40,.07)}
.opts.tac{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opts.tac .opt{justify-items:center;text-align:center}
.opts.tac .opt .t{justify-content:center;padding-right:0}

/* ---------- 读数条 ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:3.4em minmax(0,1fr) 4.4em;gap:8px;align-items:center;font-size:13px}
.bar .tr,.bbar .tr{position:relative;height:10px;background:var(--track);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.bar .tr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.25) 9px 10px)}
.bar .fi{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffe9a3 0 3px,var(--gold-1) 3px 7px,#b9781d 7px)}
.bar .fi.red{background:linear-gradient(#ffb19e 0 3px,#d8432c 3px 7px,#962513 7px)}
.bar .v{text-align:right;font-family:var(--f-num);font-size:18px;line-height:1}
.bar .v small{font-size:10px;color:var(--faint)}
.bar.solo{grid-template-columns:minmax(0,1fr)}
.bbar{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.8em;gap:8px;align-items:center;font-size:13px}
.bbar .z{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--faint)}
.bbar .fi{position:absolute;top:0;bottom:0;background:var(--jade)}
.bbar .fi.neg{background:var(--red)}
.bbar .v{text-align:right;font-family:var(--f-num);font-size:17px;line-height:1}

/* ---------- 武魂 / 魂环 ---------- */
.ring{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--r-white);box-shadow:0 0 0 1px var(--ring-ol);flex:none;vertical-align:-2px}
.ring.empty{border:2px dashed var(--line-2);box-shadow:none}
.ringstrip{display:flex;gap:6px;flex-wrap:wrap}
.ringstrip .ring{width:20px;height:20px;border-width:4px}
.rings-big{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.rings-big .ring{width:28px;height:28px;border-width:5px}
.rlist{display:grid}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:2px solid var(--line);font-size:13.5px}
.rrow:last-child{border-bottom:0}
.rrow .ring{margin-top:3px}
.rrow .yr{font-family:var(--f-num);font-size:17px;color:var(--gold);white-space:nowrap}
.wh-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.wh-n{font-family:var(--f-serif);font-size:18px}
.glyph{width:72px;height:72px;display:grid;place-items:center;font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold-2);background:#1a0602;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-gbtn) 4 / 4px stretch}
.evo{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.evo li{position:relative;display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line);font-size:12.5px}
.evo li + li::before{content:"▸";position:absolute;left:-14px;color:var(--faint)}
.evo li small{color:var(--faint)}
.evo li.now{box-shadow:inset 0 0 0 2px var(--gold)}
.evo li.past{opacity:.55}
.whs{display:grid;gap:8px}
.whs .w{display:grid;gap:3px;padding:8px 10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.whs .w.vessel{box-shadow:inset 0 0 0 2px var(--gold)}
.whs .w.off{opacity:.6}
.trait{display:grid;gap:2px;margin-bottom:10px}
.trait b{font-family:var(--f-serif);font-size:16px}
.path{display:grid;gap:6px;margin-top:10px;padding:10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--gold-0)}
.path-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.path-h .num{color:var(--gold)}
.next{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.kv{display:grid;gap:6px;font-size:13.5px}

/* ---------- 行囊 / 拍卖 / 机缘 ---------- */
.bonemap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:400px;margin:0 auto}
.bonemap .bs{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.bonemap .bs.on{box-shadow:inset 0 0 0 3px var(--c,var(--gold))}
.slots,.flist{display:grid;gap:8px}
.slot,.fcard{background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;padding:7px 10px}
.slot{display:flex;gap:8px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sl-m{display:grid;gap:2px;min-width:0;flex:1 1 210px}
.sl-m b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.sl-b{display:flex;gap:6px;flex-wrap:wrap}
.fcard{display:grid;gap:4px}
.fgrp + .fgrp{margin-top:12px}
.fgrp > summary{cursor:pointer;list-style:none}
.fgrp > summary::-webkit-details-marker{display:none}
.fgrp > summary::before{content:"▸";margin-right:-2px;transition:transform .15s}
.fgrp[open] > summary::before{transform:rotate(90deg)}
.fcard.past{opacity:.6}
.fc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fc-h b{font-size:15px}
.fc-h .st{margin-left:auto}
.tierb{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;font-family:var(--f-serif);font-weight:900;font-size:13px;color:#fff6dc;background:var(--c)}
.fc-m{display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--dim)}
.fc-x{font-family:var(--f-serif);font-size:13.5px;line-height:1.75}
.fc-go{justify-self:end}

/* ---------- 天下 ---------- */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.panel .seg{margin-bottom:10px}
.seg button{min-height:34px;padding:1px 14px;font-size:13.5px;font-weight:700;letter-spacing:.1em;color:var(--dim);background:#efd9a2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch}
.seg button[aria-pressed="true"]{background:var(--mar-3);color:var(--gold-2);border-image-source:var(--fr-btn)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--faint);font-size:12px;letter-spacing:.08em}
td.r,th.r{text-align:right}
table.rk td{white-space:normal;vertical-align:top}
table.rk td.num{white-space:nowrap;padding-top:9px}
table.rk td.r.num:first-child{width:2.2em}
table.rk td .small{font-size:12px;line-height:1.45}
tr.me td{background:var(--gold-bg);color:var(--gold)}
tr.dead td{color:var(--faint)}
.news{display:grid}
.news > div{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:2px solid var(--line);font-size:13.5px;line-height:1.65}
.news > div:last-child{border-bottom:0}
.news .num{color:var(--gold)}
.news .star{font-weight:700}

/* ---------- 季报 ---------- */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rep-grid > div{display:grid;gap:2px;padding:8px 10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.rep-grid small{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
.rep-grid b{font-family:var(--f-num);font-size:23px;font-weight:400;line-height:1.1}
.rep-hz{color:var(--red);font-size:13.5px;line-height:1.7}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:70;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:6px 14px;background:var(--mar-1);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-btn) 4 / 4px stretch;font-size:13.5px;pointer-events:none;animation:flashIn .25s both}
/* 行动反馈占据固定的文档空间，不覆盖按钮，也不在更新后推动按钮。 */
.action-feedback{height:96px;box-sizing:border-box;overflow:auto;overflow-wrap:anywhere;scrollbar-gutter:stable;margin:10px 0 2px;padding:10px 12px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line);font-size:13.5px;line-height:1.6}
.action-feedback b{display:block;color:var(--gold-2);font-size:14px}
.action-feedback .deltas{margin-top:6px}
.action-feedback .delta{animation:none;max-width:100%;white-space:normal;overflow-wrap:anywhere}
@media(max-width:520px){.action-feedback{height:112px}}

/* ---------- 封面 / 开局 ---------- */
.title-plate{text-align:center;padding:12px 10px 14px}
.title-plate .sec-t{color:var(--dim);letter-spacing:.3em}
.logo{font-family:var(--f-disp);font-weight:400;font-size:clamp(56px,16vw,96px);line-height:1.08;letter-spacing:.04em;color:var(--gold-2);text-shadow:4px 4px 0 #1b0602}
.logo em{font-style:normal;color:#ff8f6b}
.lede{max-width:30em;margin:8px auto 0;font-family:var(--f-serif);font-size:14.5px;line-height:1.85}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--dim)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .px{color:var(--gold-1)}
.meta b{font-size:20px;color:var(--gold-2)}
.resume{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.idc{display:grid;gap:4px;align-content:start;min-width:0;padding:9px 12px 10px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;transition:transform .12s ease}
.idc:hover{transform:translateY(-3px);background:#fbe7ad;border-image-source:var(--fr-tile-hot)}
.idc-k{display:flex;justify-content:space-between;gap:6px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
.idc h3{font-size:17px}
.idc-tag{font-family:var(--f-serif);font-size:13.5px;color:var(--dim)}
.idc-w{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px}
.idc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--faint)}
.pips i.on{background:var(--gold);border-color:var(--gold)}
details.panel > summary{cursor:pointer}
details.panel:not([open]) > summary{margin-bottom:0;border-bottom:0;padding-bottom:0}
.ledger td{white-space:normal}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:4px 8px 10px}
.topline{display:flex}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.pc h4{margin:0 0 4px;font-family:var(--f-ui);font-size:12.5px;letter-spacing:.3em}
.pc .pro h4{color:var(--jade)}.pc .con h4{color:var(--red)}
.pc ul{margin:0;padding-left:1.1em}
.pc li{font-size:13.5px;line-height:1.7}
input.nm{width:min(280px,100%);font:inherit;font-size:16px;padding:7px 12px;color:#3a170a;background:#f8ecc8;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;outline:none}
input.nm:focus{border-image-source:var(--fr-tile-hot)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.perk{position:relative;display:grid;gap:4px;align-content:start;padding:9px 12px 10px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch}
.perk b{font-family:var(--f-serif);font-size:16px}
.perk span{font-size:13px;line-height:1.65;color:var(--dim)}
.perk[aria-pressed="true"]{background:#fde6a0;border-image-source:var(--fr-tile-hot)}
.perk[aria-pressed="true"]::after{content:"选";position:absolute;top:-10px;right:-6px;width:22px;height:22px;display:grid;place-items:center;background:#b5341f;color:#fff2d6;font-family:var(--f-disp);font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff2d6,0 0 0 4px #b5341f;transform:rotate(8deg)}
.go{display:flex;justify-content:center;padding:4px 0 8px}

/* ---------- 结局卷宗 ---------- */
.dossier{display:grid;gap:16px}
.stamp{position:absolute;right:12px;top:8px;padding:6px 8px;font-family:var(--f-disp);font-size:34px;line-height:1;color:#b3301e;box-shadow:inset 0 0 0 3px #b3301e;transform:rotate(-8deg);opacity:.92}
.port-h{display:grid;gap:4px;padding-right:80px}
.port-h .fh{font-family:var(--f-disp);font-size:clamp(34px,8vw,52px);line-height:1.05;color:var(--gold)}
.port-h .nm{font-family:var(--f-serif);font-weight:900;font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{padding:2px 10px;font-family:var(--f-serif);font-weight:700;font-size:13px;color:var(--gold);box-shadow:inset 0 0 0 2px currentColor}
.port-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:620px){.port-grid{grid-template-columns:minmax(0,1fr)}}
.radar{width:100%;max-width:300px;justify-self:center}
.grade{font-family:var(--f-disp);font-size:46px;line-height:1;color:#b3301e}
.afterlife{display:grid;gap:6px;font-family:var(--f-serif);font-size:14.5px;line-height:1.75}
.afterlife div{border-left:3px solid var(--line-2);padding-left:10px}
.end-tx{font-family:var(--f-serif);font-size:15.5px;line-height:1.9}
.port-go{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@keyframes cardIn{from{opacity:0;transform:translateY(16px) rotate(-1.2deg)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}}
@keyframes bump{30%{transform:scale(1.28);color:#fff}}
@keyframes glow{50%{filter:brightness(1.08) drop-shadow(0 0 6px rgba(246,210,122,.9))}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes flashIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flashOut{to{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.achievement-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}.achievement-card{border:1px solid var(--line);padding:12px;background:rgba(255,255,255,.025)}.achievement-card.earned{border-color:var(--gold)}.achievement-card.locked{opacity:.65}.achievement-card p{font-size:12px;line-height:1.65;margin:7px 0 4px}.achievement-card small{font-size:11px;line-height:1.6;color:var(--dim)}.achievement-state{float:right;font-size:11px;color:var(--dim)}
/* 势力图沿用褐金像素纸面，手机端保留可读据点。 */
.campaign-summary{display:grid;gap:3px;padding:10px 12px;margin-bottom:12px;border:2px solid var(--gold-0);background:var(--mar-1);font-size:12px}
.campaign-summary>b{font-size:15px;color:var(--gold-2)}
.campaign-map{overflow:auto;border:4px solid #8a5728;box-shadow:0 0 0 2px #d8b66c;background:#e7d2a1}
.campaign-map svg{display:block;width:100%;min-width:570px;height:auto;font-family:var(--f-ui)}
.map-name{fill:#fff7df;font-size:14px;font-weight:700;paint-order:stroke;stroke:#3a2718;stroke-width:2px}
.map-owner{fill:#fff7df;font-size:11px;paint-order:stroke;stroke:#3a2718;stroke-width:1.5px}
.map-water{fill:#837244;font-size:17px;letter-spacing:4px}
.map-node{cursor:pointer}
.map-node:focus{outline:none}
.map-node:focus rect,.map-node:hover rect{stroke:#fff0b3;stroke-width:5px}
.campaign-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.campaign-faction{position:relative;display:grid;gap:3px;text-align:left;padding:9px 9px 8px 12px;border:2px solid #986b36;border-left:5px solid var(--fc);background:#301008;color:#f8e9c6;font-size:11px}
.campaign-faction b{font-size:13px;color:#f6d27a}
.campaign-faction .num{font-size:22px;color:#f7e5ba}
.campaign-faction span{color:#d4b38d}
@media(max-width:480px){.campaign-legend{grid-template-columns:repeat(2,minmax(0,1fr))}.campaign-map svg{min-width:565px}.campaign-summary{padding:8px}.campaign-faction{padding:8px}}


.god-requirements{margin-top:12px}.god-req-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:7px 14px;margin:10px 0}.god-req-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}.god-req-row .chip{white-space:nowrap}.god-requirements p{line-height:1.7;margin-top:9px}

.hunt-filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.hunt-filters .btn{font-size:12px;padding:7px 10px}.hunt-band{margin:18px 0}.hunt-band h4{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;color:var(--gold);font-size:14px}.hunt-band h4 span{font-weight:400;font-size:12px}.hunt-band .opts{margin-top:10px}.hunt-band .opt:disabled{--fg:#513820;--dim:#70583f;--faint:#80674e;--red:#a33222;--jade:#326634;--gold:#88550e;--line-2:#a88c66;--gold-bg:rgba(136,85,14,.1);opacity:1;filter:none;background:#eadfc7;cursor:not-allowed}.hunt-block-reason{color:#795030;font-size:12px;line-height:1.6;border-top:1px dashed #b99b6c;padding-top:7px}
.spirit-switch{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.spirit-switch button{flex:1;white-space:normal;min-width:130px}.spirit-switch small{display:block;font-size:11px;margin-top:4px;font-weight:400}

/* Immediate, in-flow system feedback. No overlay blocks actions. */
.system-console{border-color:#cda85d;background:linear-gradient(135deg,#3b2110,#20170f);}
.system-console h2{font-size:20px;color:#f3d293;margin:4px 0 8px;}
.system-console h3{font-size:17px;color:#f4d79d;margin:8px 0;}
.system-console p{line-height:1.8;font-size:14px;}
.system-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:10px 0 14px;}
.system-steps span{font-size:12px;border:1px solid #76502e;padding:8px 3px;text-align:center;color:#bd9b73;}
.system-steps .active{color:#ffdfa0;border-color:#ecc270;background:#6a431b;}
.system-steps .complete{color:#b9d6ab;background:#24321e;border-color:#658557;}
.system-receipt{min-height:126px;padding:14px;border-left:3px solid #a7c88e;background:#172319;color:#d8e5ca;}
.system-receipt b{font-size:16px;color:#d3edb7;}.system-receipt p{margin:7px 0;}.system-target{padding-top:12px;}
@media(max-width:500px){.system-steps{grid-template-columns:repeat(2,minmax(0,1fr));}.system-console h2{font-size:18px;}.system-receipt{min-height:150px;}}

.entry-tag{display:inline-block;margin:8px 0 0;color:#f0ce88;font-size:12px;border-bottom:1px solid #947039;padding-bottom:3px;}.origin h3{line-height:1.5;}.origin .hint{font-size:12px;opacity:.85;}
/* Short, skippable visual-novel scenes with no timed gameplay gate. */
.cast-card{background:#f1dfb6;border:1px solid #b38e52;padding:10px 12px;margin:10px 0;color:#4b301f;}
.cast-card summary{cursor:pointer;font-weight:700;font-size:15px;line-height:1.6;}.cast-card summary span{display:block;color:#806546;font-size:12px;font-weight:400;}
.cast-intro{display:block;margin-top:8px;}.cast-intro p{font-size:13px;line-height:1.7;margin:5px 0;}.cast-intro b{color:#674624;}
.cinema-stage{isolation:isolate;position:relative;overflow:hidden;min-height:240px;background:linear-gradient(150deg,#4a4a54,#292d36 45%,#141d22);border:2px solid #a8834c;color:#f7e6c8;}
.cinema-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 15%,#d6b57d55,transparent 60%),repeating-linear-gradient(90deg,transparent 0 90px,#020c1535 91px 94px);pointer-events:none;}
.cinema-window{position:absolute;left:7%;top:12%;width:48%;height:45%;background:linear-gradient(145deg,#a7b4ae44,#eed3aa22);border:9px solid #212729;box-shadow:0 0 70px #d4c7a522;transform:skewY(-4deg);pointer-events:none;}
.cinema-window:before{content:'';position:absolute;left:50%;height:100%;width:5px;background:#242b2c;}.cinema-window:after{content:'';position:absolute;top:50%;width:100%;height:5px;background:#242b2c;}
.cinema-location{position:relative;z-index:2;display:inline-block;max-width:95%;margin:14px;padding:6px 9px;background:#111a21b8;font-size:11px;letter-spacing:.07em;}
.cinema-dialogue{position:relative;z-index:3;margin:72px 12px 12px;padding:14px 17px;border:1px solid #baa471;background:#15232bec;box-shadow:0 8px 20px #0005;animation:dialogue-enter .28s ease-out both;}

'use strict';
const VERSION='1.9.0', SAVE_KEY='gaowu-renjian-v1';
const ORIGINS=[
{id:'yang',entryTitle:'寒门学生 · 系统逆袭',entryText:'家里凑出的报名费，只够让你站上测评台。别人拿到高评级，你只有D；但走下台时，一个只有你能看见的系统亮了。',entryTag:'D级系统开局 · 推荐首次体验',roleName:'林砚',destiny:'devour',name:'阳城寒门',tag:'一张武科报名表，改写一家人的命运。',trait:'苦学 · 每次研习额外修为 +8',desc:'父亲把攒了很久的钱推到桌边，母亲说家里还能周转。你知道武科的报名费只是开始。阳城一中的走廊里，方平与吴志豪正讨论气血检测，而你第一次认真想：如果只能押一次，要不要押在自己身上？',cash:12,skill:6,mind:8,rep:0,bond:'方平',names:['寒门账本','借来的药钱','给阳城的回信']},
{id:'mowu',entryTitle:'旧巷少年 · 剑骨天才',entryText:'你在武道大学附近长大，家里开着一间小铺。觉醒剑骨让你成为老师眼中的天才，也让暗处的敌人记住了你。',entryTag:'SS剑骨 · 熟人引路',roleName:'沈星河',destiny:'sword',name:'魔都旧巷',tag:'高墙之外长大，向武大的灯火奔跑。',trait:'熟门熟路 · 每期补给学分 +2',desc:'你在魔武附近的老街长大，见过背着兵器的学生，也见过只在深夜驶入校门的车。家里的小铺靠学生生意维持。直到一位熟客再也没有回来，你才意识到，这座大学并非通往富贵的捷径。',cash:18,skill:8,mind:5,rep:2,bond:'李长生',names:['后勤部的旧账','一间没有关门的铺子','归来的钥匙']},
{id:'nanjiang',entryTitle:'南江后进 · 战痕推演',entryText:'地方武馆的木桩已经开裂，你仍每天练到天黑。D级战感不被看好，系统开始把每一次破绽变成可改进的路线。',entryTag:'D级推演 · 实战逆袭',roleName:'顾野',destiny:'echo',name:'南江后进',tag:'名校之外，也有人走出自己的路。',trait:'实战底子 · 战法训练额外 +3',desc:'南江的武道资源比不上魔都，但你记得王金洋从阳城走出去的消息。地方武馆的木桩被雨水泡得开裂，你仍练到天黑。你想去更远处看看，也想证明故乡留下的人并非注定只能仰望。',cash:14,skill:12,mind:5,rep:1,bond:'王金洋',names:['地方武馆','南江的名单','不迁走的根']},
{id:'army',entryTitle:'军属新生 · SSS觉醒',entryText:'家里有一枚勋章，长辈很少讲它的来历。SSS觉醒让全场停下交谈；掌声、培养名额和敌方的猎杀名单同时到来。',entryTag:'SSS战躯 · 天才与猎杀',roleName:'陆骁',destiny:'solar',name:'军属子弟',tag:'家中的勋章很轻，背后的名字很重。',trait:'阵地意识 · 初始防线 +8；守备额外补给 +2',desc:'家里有一枚没有讲完来历的勋章。你从小习惯亲人突然离家，也习惯大人不肯回答去向。武科报名那天，你想知道那些沉默背后究竟是什么，而不仅仅是再成为照片上的一个名字。',cash:15,skill:10,mind:7,rep:3,bond:'唐峰',names:['封口的家书','旧部的消息','勋章的另一面']},
{id:'merchant',entryTitle:'商家新生 · 从质疑起步',entryText:'家里付得起丹药，却替不了你上擂台。D级报告让嘲讽更加刺耳；系统要你用真实训练，赚到第一份属于自己的奖励。',entryTag:'D级系统 · 用战绩说话',roleName:'许知衡',destiny:'devour',name:'商贾新生',tag:'买得到丹药，买不到生死之间的信任。',trait:'经营头脑 · 筹资收入 +8万',desc:'你的家庭付得起昂贵的丹药，却没有谁能替你上擂台。有人说你是拿钱堆出来的气血。你不愿假装财富毫无用处，也不愿让它成为别人认识你的全部。第一笔真正由你决定的钱，应该花在哪里？',cash:48,skill:4,mind:7,rep:0,bond:'傅昌鼎',names:['家族的投资','亏损的车队','不只是一门生意']},
{id:'healer',entryTitle:'医家传人 · 精神天赋',entryText:'你从小跟着家人学习包扎。S级精神天赋让你察觉别人的伤势与危险，也让你不得不决定何时站到队伍前面。',entryTag:'S级神识 · 救援与护道',roleName:'苏见微',destiny:'oracle',name:'医家传人',tag:'学过如何救人，才知道每一次出手的分量。',trait:'救护专长 · 休整额外恢复，救援收益增加',desc:'你会包扎，也认得几种价格惊人的武者药剂。长辈告诉你，医术无法替所有人做决定。可当你在武馆门口看见伤员被抬下来时，仍觉得自己至少应该站得更近一些。',cash:20,skill:5,mind:12,rep:2,bond:'陈云曦',names:['急救箱','被留下的伤员','活着的人']},
{id:'craft',entryTitle:'兵器学徒 · 剑道成长',entryText:'你靠修理训练刀挣工钱，知道裂纹会在什么时候要命。SS级剑骨把你从铁砧旁推向了试武台。',entryTag:'SS剑骨 · 剑道成长',roleName:'周砺',destiny:'sword',name:'兵器学徒',tag:'铁砧上的火星，也能照亮一条武道。',trait:'工匠手艺 · 装备购买七五折',desc:'你跟着师傅修过训练刀，知道一道裂纹会在什么时候要命。武者的兵器很昂贵，学徒的工钱很少。你想有一天亲自握住自己锻出的武器，而不是永远隔着柜台看别人走进风雪。',cash:18,skill:11,mind:6,rep:1,bond:'李长生',names:['炉火与裂纹','不能出厂的刀','铸给后来者']},
{id:'scholar',entryTitle:'文科尖子 · 藏锋观测',entryText:'你的文化课很好，武科测评却只给D级。别人忽略的细节在灵瞳里逐渐清楚，系统给出了第一份观察与训练任务。',entryTag:'D级观测 · 情报藏锋',roleName:'白知远',destiny:'shadow',name:'文科尖子',tag:'你相信答案，也相信答案背后还有问题。',trait:'考据天赋 · 研习额外情报 +2',desc:'老师劝你稳稳当当地考一所普通名校。你的文化课成绩很好，武科的气血却不算突出。一本桩功笔记被你写满了疑问。或许天赋也可以是看见别人忽略的联系，然后比别人多走一步。',cash:16,skill:4,mind:16,rep:0,bond:'吴志豪',names:['笔记的边角','一份反常的报告','把知识留下']},

M(0,'一张要交回去的表','放学铃响过，武科报名表还留在你的课桌上。老师说，选了武科并不等于放弃文化课，但家里的钱、你每天能用的时间，都只有那么多。\n窗外，方平正追问检测的细节。吴志豪把自己的桩功笔记递过来，说你可以先看看。你把表翻到最后一页，那里需要一个签名。',[
O('签下名字，先把基础练稳','你没有向家里保证一定考上，只答应认真算清每一步。吴志豪把笔记借给了你。',{xp:20,mind:3,bonds:{吴志豪:8},flags:['steady_start']}),
O('和方平一起盘算备考开支','你们把报名、营养、检测列成三栏，删去了几项不必要的开支，腾出一笔可以用于备考的预算。',{cash:4,intel:3,bonds:{方平:8},flags:['account_start']}),
O('请求家里先为你买一份药剂','药钱从家中积蓄里拿出。你收好瓶子，也记下这份不能当作理所当然的支持。',{cash:-4,xp:34,flags:['family_debt']},{cash:4})]);
M(0,'返乡的武大学生','王金洋回到阳城的消息在学校里传开。你终于见到一个真正从这里走出去的人，才发现他并没有多少空闲：指导、任务、自己的修炼，都在争抢时间。\n他看了你一遍桩功，没有立刻谈天赋，只问：“你知道自己刚才为什么站不住吗？”',[
O('请他纠正动作，不急着追问捷径','王金洋让你重新站了一遍。腿抖得厉害，但那条一直不顺的发力路径终于清楚。',{xp:24,skill:5,bonds:{王金洋:10}}),
O('询问武者任务与资源的关系','你第一次听见武道光鲜之外的账。高品不是不缺资源，只是每一次抉择更贵。',{intel:7,mind:3,bonds:{王金洋:5}}),
O('提出一次受控的基础切磋','王金洋只用远低于自身的力量陪你拆招。你没能击败他，却知道了实战与练习的距离。',{skill:10,energy:-12,bonds:{王金洋:6}})]);
M(0,'气血检测室外','走廊里安静得能听见鞋底摩擦地面的声音。检测只是武考的一部分，后面还有专业考核与文化课。有人已经开始把今天的数字当成命运判决。\n轮到你之前，一位同学紧张得忘了自己的考号。你手心同样出了汗。',[
O('稳住呼吸，按自己的节奏应考','你没有盯着别人报出的数字。此前扎实的训练，让你把这一场完整地走了下来。',{xp:20,rep:4,flags:['exam_passed']}),
O('先帮同学找回考号，再进入考场','耽误的只是几分钟。走出检测室时，那位同学还等在门边，郑重向你道谢。',{rep:7,rescue:3,flags:['exam_help','exam_passed']}),
O('用专业考核与文化课证明自己','你逐题检查，没有把未来全压在一次气血读数上。考官在你的答卷上停留得比预想更久。',{mind:7,intel:3,flags:['exam_passed']})]);
M(0,'录取之后的晚饭','魔武的录取消息来得比你想象中安静。桌上还是熟悉的饭菜，家人先问的是车票与行李，然后才小心地问学校危险不危险。\n你还不知道地窟，也不能解释自己尚未见过的世界。窗外有人放起了鞭炮，你却忽然明白，离开不是一个人的事。',[
O('答应每期寄信，把近况写清楚','你把地址认真写在纸上。以后每一次选择走远，都有人知道你仍在努力回来。',{mind:5,flags:['write_home'],bonds:{吴志豪:5}}),
O('把剩下的钱留给家里','你把钱放回抽屉，只带走必要的路费。新的生活要靠自己的奖学与任务撑起。',{cash:-5,rep:8,flags:['support_family']},{cash:5}),
O('与旧友约定，将来为阳城办一间武馆','吴志豪说先别把招牌做得太大，至少要让普通学生走得进门。你把这句话记住了。',{rep:4,bonds:{吴志豪:10},flags:['hometown_promise']})]);
M(1,'魔武的第一张账单','校园比你想象中大。资源兑换处的价目表也比想象中长：丹药、兵器、训练场、指导机会，每一样都对应真实的学分。\n方平在柜台前看了很久。傅昌鼎与你打招呼，说新生不能只看宿舍，还得看自己准备怎么站稳脚跟。',[
O('把第一笔学分投入基础修炼','你选了适合当前阶段的资源，放弃了那件暂时驾驭不了的昂贵兵器。',{credit:8,xp:28,flags:['foundation']}),
O('与同届组成互助小组','每个人的资源不多，但可以共享训练经验与任务消息。你们先约定不隐瞒危险。',{credit:5,bonds:{傅昌鼎:9,陈云曦:6},flags:['study_group']}),
O('研究兑换与任务的供需','柜台上的数字渐渐连成一条线。你知道了哪些东西紧缺，也知道投机并非没有代价。',{cash:8,intel:6,bonds:{方平:5}})]);
M(1,'导师的那一问','导师面谈并不轻松。吕凤柔问你想不想赢，唐峰则问，你若失误，谁会替你承受后果。两种问题落在同一张桌上。\n你意识到，择师也意味着选择自己愿意接受哪一种要求。',[
O('追随吕凤柔，接受严格的实战指导','吕凤柔没有许诺护你一辈子，只让你记住遇险时先求生。师生关系从一次纠错开始。',{skill:9,bonds:{吕凤柔:18},set:{mentor:'吕凤柔'}}),
O('追随唐峰，练习团队与阵地配合','唐峰让你从最普通的队形练起。站在正确的位置，比逞一时之勇更难。',{defense:7,bonds:{唐峰:18},set:{mentor:'唐峰'}}),
O('暂以公共课程打底，向多位老师请教','你没有获得专属资源，却保留了比较不同道路的机会。后勤部的老人给你指了书架的位置。',{mind:8,credit:5,bonds:{李长生:12},set:{mentor:'公共课程'}})]);
M(1,'后勤部的老人','李长生把你挑中的兵器放回架上，说这东西现在只会拖慢你。你以为他在劝你省钱，他却让你拿起一把更普通的刀，重新站稳。\n窗外学生来来往往，老人记得不少人的名字，也记得一些再没有回来还东西的人。',[
O('接受建议，把钱留给根基','你带走了基础兵器，柜台上多余的预算留了下来。李长生点点头，没有再多说。',{gear:1,credit:5,bonds:{李长生:8}}),
O('留下来帮他整理报损清单','你在清单上看到的不是抽象数字，而是一次次任务留下的痕迹。',{intel:6,mind:5,bonds:{李长生:10},flags:['damage_list']}),
O('询问剑术，愿意从一千次出手练起','他只纠正了你的握法。简单到你几乎失望，却又在练习中发现自己远没做好。',{skill:12,energy:-10,bonds:{李长生:6}})]);
M(1,'宿舍灯灭之前','赵磊对一次训练结果不服，傅昌鼎的玩笑又恰好刺中了他的自尊。气氛从争论变成对峙，旁边的人开始让出地方。\n这场胜负不会决定整个武大生涯，但你们以后还会站在同一条战线上。',[
O('约一场点到为止的公开切磋','规则说清之后，输赢终于有了边界。赵磊愿意承认破绽，也要你承认他的进步。',{skill:7,bonds:{赵磊:12,傅昌鼎:5},flags:['rival_respect']}),
O('请双方各自说清真正不满的事','有人在意排名，有人在意被当成笑话。说开不等于立刻成为朋友，但冲突不再没有名字。',{mind:7,bonds:{赵磊:6,傅昌鼎:6}}),
O('借这次争论建立每周对练规则','你把围观者也拉进计划。竞争没有消失，却开始给所有人带来进步。',{xp:22,defense:3,flags:['team_drill']})]);
M(2,'交流赛名单','高校交流的名单贴了出来。站在名单外的人未必更弱，只是每个位置都有取舍。你们既要争名次，也要替学校争取后续资源。\n方平希望打出气势，唐峰却提醒大家：赛场上的配合，会在地窟里变成活命的习惯。',[
O('争取主力位置，承担正面交锋','你把自己的短处写在战术板上，请队友帮你补齐，而不是把自信当作战术。',{skill:9,rep:6,energy:-10,flags:['tournament_front']}),
O('担任替补与战术观察','你一遍遍记下对手的起手与习惯。不上场并不等于没有参与胜负。',{intel:8,defense:4,flags:['tournament_tactics']}),
O('负责后勤，让每个队友按时恢复','你核对资源和伤情，把容易被忽略的小事做得没有差错。',{supply:9,bonds:{陈云曦:10},flags:['tournament_supply']})]);
M(2,'最后一场之前','上一场的伤势还没消。队医说，继续比赛并非完全不行，但恢复时间会拉长。替补队员已经热身，却迟迟等不到一个明确决定。\n观众席只看得到名单上的名字，队友却看得到你握刀时微微发抖的手。',[
O('相信替补，把准备好的战术交给他','你坐到场边，把观察到的弱点一条条说清。那场比赛不再只是某一个人的证明。',{defense:8,bonds:{傅昌鼎:8},flags:['trust_reserve']}),
O('带伤上场，但缩短交锋时间','你选择了风险，也为失败准备了交接。胜负不保证，伤势却真实留了下来。',{rep:10,skill:8,injury:12,flags:['scar_tournament']}),
O('公开伤情，重新讨论队伍目标','名次与健康被放到同一张桌上。有人失望，也有人第一次相信自己可以说出撑不住。',{mind:6,rescue:5,flags:['honest_injury']})]);
M(2,'奖杯后的分配','资源份额到账时，争论比领奖时热闹。主力觉得自己付出最多，替补与后勤却也留下了伤和夜里的工作。\n方平把账摆出来，要大家说出一个能继续共事的分法。',[
O('按贡献分配，并保留伤员专款','你让每一项付出都有记录，也给最难说出口的需要留出位置。',{credit:12,supply:5,defense:5,flags:['fair_fund']}),
O('优先培养最强者，争取下一场胜利','资源集中会更快见效，代价是其他人需要更久等待。你承诺公布下次的轮换标准。',{xp:44,credit:8,defense:-3,flags:['elite_fund']}),
O('拿出自己的份额设互助池','你没有要求所有人跟着捐。愿意的人留下名字，这笔小钱开始有了别的意义。',{credit:4,rescue:8,rep:8,flags:['mutual_fund']})]);
M(2,'任务大厅里的第一份委托','校外任务没有观众，也不会因为你是新生就少一点意外。秦凤青指着一份酬劳较高的委托，说机会不错；登记老师则要求先核验情报。\n纸上的目标很简单，纸外的人却没有那么简单。',[
O('先核验行程与撤退路线','你发现了任务简报中一处时间矛盾。行动延期一天，几个人却因此避免了撞进未知的局面。',{intel:10,credit:7,bonds:{唐峰:5},flags:['verified_task']}),
O('加入有经验的队伍，按分工完成任务','你没有抢最显眼的位置，却把自己的环节做稳了。第一次任务收入握在手里很实在。',{cash:10,credit:8,skill:5}),
O('留校承担任务联络与文档整理','你暂时不去前线，但看见了多支队伍共同面对的问题。它们值得有人记下来。',{mind:8,intel:7,credit:6})]);
M(3,'第一次听见地窟','门关上之后，讲解老师收起了平时的语气。地窟、通道、城池与防线，这些词把你过去看不懂的新闻突然接了起来。\n没有人要求你立刻变得勇敢。真正的要求是：从这一刻起，决定必须建立在知道代价的基础上。',[
O('报名受训后进入外域','你先签下训练安排。勇气不能替代识路、辨敌与撤退。',{xp:28,skill:7,flags:['cave_trained']}),
O('先补完情报课，再申请任务','你把地图上的每一条退路记熟。未知并没有消失，却可以被一点点划小。',{intel:12,mind:5,flags:['cave_trained','map_ready']}),
O('选择后勤轮值，先理解防线如何运转','你接触到伤员与运输队，知道一座前线城池是被多少普通环节撑起来的。',{supply:12,rescue:4,flags:['cave_trained']})]);
M(3,'希望城的城门','城门内的忙碌没有庆典的热闹。运输队让出伤员通道，巡防武者匆匆吃完一口饭。城墙之外，光线与地面不同，时间仿佛换了刻度。\n带队者告诉你，本次任务只是建立外沿哨点。谁若擅自追敌，可能把整队拖进包围。',[
O('跟队设立哨点，严格记录敌情','你按约定留下标记，没有为一名落单敌人脱离队形。返城时，记录比战利品更有用。',{intel:9,defense:6,credit:8,flags:['outpost']}),
O('帮运输队打通一段拥堵路线','不显眼的路段畅通后，伤员比预计更早进城。你第一次在撤下的担架旁听见轻轻的道谢。',{supply:8,rescue:8,credit:6}),
O('陪秦凤青侦察侧翼，但约定时间底线','你们把撤退信号说了三遍。秦凤青嘴上嫌啰嗦，最后却按时出现在约定地点。',{intel:10,skill:5,bonds:{秦凤青:8},flags:['retreat_signal']})]);
M(3,'回程路上的岔口','你们在返城时发现另一支小队留下的求援标记。天色难辨，身后的追兵消息尚未确定。带队者要你判断：继续前进，还是分人去看？\n地图上那条能绕回城的路，此刻不再只是笔记里的线条。',[
O('依据地图组织接应','你标出的路线避开了一处敌方巡逻区。失联小队带着伤员撤回，记住了你们留下的路标。',{rescue:14,defense:5,flags:['team_saved']},{intel:20}),
O('向城内传讯，守住交汇点等待专业救援','你没有让全队贸然深入。救援来得稍迟，仍接回了大部分人。',{rescue:7,supply:-3,flags:['team_partial']}),
O('优先护送手中的伤员回城','你保护了眼前的人，也错过了接应的窗口。归队后，你必须如实报告自己的判断。',{rescue:4,defense:-4,flags:['team_lost']})]);
M(3,'战利品登记处','能源资源带回来了，登记人员一一称量。秦凤青盯着分配表，你则注意到归属一栏：个人发现、团队战利品、公共物资，三者不能混为一谈。\n这一次分配，会成为下次同行是否还愿意相互信任的依据。',[
O('按约定上交，领取自己的份额','你没有多拿，也没有替别人慷慨。清楚的分配让下一次合作少了一层猜疑。',{credit:18,cash:6,supply:4,bonds:{秦凤青:5}}),
O('申请把个人份额兑换为修炼资源','你在登记后换走了自己应得的那部分。每一份增长都能追到来源。',{credit:7,xp:50}),
O('将个人份额捐入救援库','登记员认真记下你的名字，随后把物资送往伤员区。你知道自己放弃了什么，也知道它去了哪里。',{credit:5,supply:12,rescue:6,flags:['donated_crystal']})]);
M(4,'同时抵达的两份请领','前线急需防御物资，伤员区也在等药。库里暂时没有足够的储备满足双方。负责登记的人说，可以分开给，但谁都不会完全满意。\n你手里是自己的任务奖励，而不是一张能够凭空变出物资的命令。',[
O('把个人资源换成救护物资','药品按登记送出。你放缓了自己的修炼，伤员区却多了几个能够熬过这一夜的人。',{credit:-8,rescue:14,supply:6,flags:['medical_stock']},{credit:8}),
O('优先保障城墙防御','加固完成后，一处薄弱点终于有人敢长期站守。救护的缺口仍需后续补上。',{defense:12,supply:-3,flags:['wall_stock']}),
O('组织限额配给，公开缺口','没有一方拿到全部需求，但大家知道剩下的资源在哪里、为何还没来。',{defense:5,rescue:5,intel:4,flags:['open_ration']})]);
M(4,'天门方向的异动','城外侦察发现异常调动。消息还不足以证明一场大战，却足以让任何一支轻率离城的队伍付出代价。\n守城者需要的是可靠的判断。恐慌与侥幸一样，都可能把人推向错误的位置。',[
O('交叉验证情报，再调整防务','数条独立消息对上之后，虚惊与真正的危险终于分开。守军有时间重新部署。',{intel:10,defense:10,flags:['warning_network']},{intel:25}),
O('先缩短巡逻半径，稳住现有防线','你承认信息不足，主动减少暴露。代价是外沿收获减少，换来的是更完整的队伍。',{defense:8,supply:-4,flags:['cautious_front']}),
O('请强者带队进行有限试探','试探以撤退条件为先，前线得到了一手观察。你没有把这次行动写成必胜进攻。',{intel:7,skill:6,injury:5,flags:['probe_front']})]);
M(4,'那支小队后来怎样了',s=>s.flags.team_saved?'曾被你接应的小队重新轮值。他们带来一份独立侦察记录，主动要求补上最吃紧的哨位。\n救回的人没有凭空恢复全部战力，但恢复下来的人，开始有能力再保护别人。':s.flags.team_partial?'获救队员中仍有人养伤。队长给你送来一封简短的信，说接应虽迟，却让一些人有机会再次看见城门。\n你们需要面对的是更有限的人员，而不是假装一切都没有发生。':'那处求援标记被收入战后档案。登记员确认，没有完整小队回到城里。有人要追责，也有人只是想知道最后发生了什么。\n你当时保住了自己护送的伤员，但失去的接应力量不会再出现在防线上。',[
O('把经历写入救援流程','你把不愿回想的细节整理成可执行的规则。前线开始使用统一标记与超时机制。',{intel:8,defense:6,flags:['rescue_protocol']}),
O('亲自接手缺口，给大家恢复的时间','你承担额外轮值，没有宣称这能抵消一切。至少这一期，没有让疲惫的人再次硬撑。',{energy:-15,defense:9,rescue:4}),
O('协助家属与伤员安排后续生活','战事之外的手续很慢，也没有掌声。你一项项做完，把可确认的消息送到该收到的人手中。',{rescue:10,rep:5,bonds:{陈云曦:7}})]);
M(4,'撤退的时刻','警报响起时，补给点还有一批没有装车的资源。留下当然可能带回更多，但撤退通道也正在变窄。\n队伍里有人盯着资源，有人已经开始清点人员。你必须在可知的风险里作决定。',[
O('丢下可替代的资源，按名单撤离','资源留在身后，人却一个个回到城门内。下期的补给会紧些，名字仍是齐的。',{supply:-7,rescue:14,defense:5,flags:['people_first']}),
O('分队搬运，以明确时限压缩风险','你设置了最后撤离时刻，也派人盯住通道。带回的物资有限，但没有把风险无限延长。',{supply:8,rescue:3,energy:-15},{intel:25}),
O('留下掩护，把搬运任务交给同伴','你的职责只到队伍脱离为止，不是独自击溃外域敌军。撤回后，肩上的伤需要时间恢复。',{supply:6,rescue:8,injury:10,skill:6})]);
M(5,'师长的旧伤','你在训练后见到李长生独自坐着，目光落在一份旧记录上。他没有解释往事，也没有把未完成的愿望强加给你。\n你能感到那份沉默的重量。一个学生该怎样回应老师没有说出口的执念？',[
O('询问他是否需要帮助，把决定留给他','你没有许诺自己做不到的事。李长生把记录合上，第一次认真听你说未来的安排。',{mind:8,bonds:{李长生:14},flags:['respect_teacher']}),
O('寻找可靠的恢复资料与资源线索','你把传言与证据分开，拒绝了两份没有依据的所谓秘方。线索不代表已经治愈，却是一条能够继续查的路。',{intel:10,credit:-6,bonds:{李长生:8},flags:['healing_research']},{credit:6}),
O('把自己的剑法练得更稳','他仍没有讲旧事，却在你练错的时候开口纠正。师承有时就在这些很小的时刻延续。',{skill:14,xp:25,bonds:{李长生:6}})]);
M(5,'吕凤柔的训练场','吕凤柔把训练强度提高了一截。有人觉得这是信任，也有人看见她在学生受伤时那一瞬间的停顿。\n她的过去有无法轻易释怀的失去，你的未来却不能只围着另一个人的仇恨转动。',[
O('谈清自己的目标，愿意同行但保留判断','她沉默了一会儿，让你重新站到场中。你们没有意见一致，却建立了能说真话的师生关系。',{mind:10,bonds:{吕凤柔:12},flags:['independent_path']}),
O('承担训练，先练会保护队友','你把强度转成了保护同伴的能力。训练结束时，你关心的不只是自己还能打几招。',{skill:10,defense:6,energy:-10,bonds:{吕凤柔:8}}),
O('建议增加恢复与轮换，减少无效伤损','你拿出记录而不是抱怨。计划修改后，训练没有变轻，伤员却逐渐少了。',{rescue:8,intel:5,bonds:{唐峰:8},flags:['training_reform']})]);
M(5,'一封没有寄出的信',s=>s.flags.write_home?'你从口袋里翻出上一期没寄出的家书。信写了一半，因为你不知该怎样描述地窟，又不想只说一切都好。\n今天终于有一段安静的时间。你可以选择告诉家人多少，也可以先问问他们的日子。':'一封家书寄到学校，问的只是天气、吃饭和旧邻居的近况。你已经很久没有主动提起这些小事。\n前线的消息塞满了你的生活，却不能让阳城的人自动知道你仍平安。',[
O('写真实的近况，也写清不能公开的部分','你没有泄露防务，也没有编造轻松。家人的回复里有担心，还有愿意听你继续说的耐心。',{mind:8,energy:15,flags:['family_trust']}),
O('寄回生活费，请旧友多照应家里','你把自己能兑现的帮助交出去。吴志豪答应有空上门坐坐，并让你别把自己逼得太紧。',{cash:-6,rescue:5,bonds:{吴志豪:12},flags:['family_supported']},{cash:6}),
O('暂存信件，先写一份同行者名单','你意识到自己更害怕忘记。那些一起回来、没能回来的人，都应当有名字。',{mind:5,rep:6,flags:['remember_names']})]);
M(5,'一份属于谁的传承','一位前线武者留下的战法整理稿被送回学校。它不是神兵，也不是某位强者全部的道路，只是经过实战修正、很有价值的一部分经验。\n你参与整理，因而拥有优先研习的机会。校方同时希望有人愿意把它编成低品学生能看懂的课程。',[
O('先完整研习，再补齐自己的短板','稿件为你所用，公共课程需要等待其他人继续整理。你得到了真切的进步，也记下这项未尽的事。',{skill:18,xp:45,flags:['private_manual']}),
O('编成公共课程，保留原作者署名','你在反复讲解中发现许多自己原先不懂的细节。更多学生得到帮助，增长不会只发生在你身上。',{skill:9,defense:10,rep:8,flags:['public_manual']}),
O('请不同战法的同学共同校对','分歧把整理时间拉长，却也暴露了只对某种体质有效的部分。经验因此更可靠。',{intel:8,mind:8,bonds:{赵磊:8,傅昌鼎:8},flags:['reviewed_manual']})]);
M(6,'一份写着你名字的任命','学校希望你负责一支新的行动小队。任命不是一张赞许，而是几个人把日程、风险和生还的希望交到你手上。\n如果你的境界还不足以担任一线主将，校方会安排强者领队，由你负责筹划。权限与能力必须对得上。',[
O('建立轮值与退出制度','你明确说明，提出伤情和恐惧不会被当成背叛。队伍得到的不是绝对勇敢，而是更可靠的信息。',{defense:12,rescue:6,flags:['rotation_rule']}),
O('集中资源培养攻坚骨干','核心小组很快形成力量，但你同时承担照顾非核心成员的责任。这项安排会影响后续联盟的态度。',{xp:55,skill:8,supply:-5,flags:['strike_team']}),
O('以情报与后勤为长处组队','你不勉强自己模仿最强的人。队伍找准了定位，为多条战线提供支持。',{intel:12,supply:9,flags:['support_team']})]);
M(6,'不愿离开的学弟','一名新生坚持申请高风险任务。他说自己差资源，也想追上同届。你看见了几个月前的自己，却不能替他把未来全部决定。\n审核表上需要你的意见。这个名字若进入名单，就不能只剩一个数字。',[
O('安排有监督的低风险任务与训练','你给出一条更慢、但能持续前进的路线。他不完全满意，却拿到了真实的机会。',{rescue:10,defense:5,flags:['junior_safe']}),
O('用自己的资源替他补齐基础','你承担了成本，也说清这不意味着他从此欠你服从。',{credit:-10,rescue:8,rep:8,flags:['junior_funded']},{credit:10}),
O('允许申请，但公布完整风险并设撤回点','他的选择受到尊重，队伍也为风险付出了额外安排。你记录了每一项约定。',{intel:6,skill:5,injury:4,flags:['junior_field']})]);
M(6,'武大之间的争论','资源分配会议上，不同学校都拿出了真实的损失与需求。名校需要持续培养强者，地方武大则担心自己永远只有等待的份。\n王金洋没有要求你为故乡无条件让步，只问规则是否允许后来者追上。',[
O('提出底线保障与公开竞争并行','最基本的课程和救护得到保障，额外资源仍按贡献竞争。没有人全赢，却出现了可以继续合作的规则。',{defense:12,supply:5,bonds:{王金洋:10},flags:['alliance_rule']}),
O('优先集中顶尖资源，承诺外派教学','你选择更快形成高端战力，也需要兑现知识回流。会议记录保留了你的承诺。',{xp:65,defense:3,flags:['teaching_debt']}),
O('发起跨校课程与任务情报共享','边界先从资料室打开。几支原本互不熟悉的队伍开始用同一套风险标记。',{intel:12,defense:8,flags:['shared_network']})]);
M(6,'宗师碑前','碑前的人并不都拥有宗师境界。有学生、后勤人员，也有迟迟不愿离开的家属。名字刻下之后，生活还要继续。\n方平站在旁边，没有像往常那样急着说话。你也开始明白，强者的意义需要由活下来的人检验。',[
O('把一部分资源长期留给遗属与伤员','你将个人所得中的一份落实为制度，而不是只在今天表达感动。',{credit:-8,rescue:12,rep:8,flags:['survivor_fund']},{credit:8}),
O('整理每个人的经历，交给后来者','记录中有失败、犹豫与普通的一天。你拒绝把他们写成从不害怕的人。',{mind:10,defense:5,flags:['memory_archive']}),
O('立下自己的守护原则','你知道一句誓言不能证明任何事，但它会成为后面每一次选择的参照。',{xp:45,mind:8,flags:['own_principle']})]);
M(7,'关于四大王庭的简报','新的简报把地窟的另一面展开：天植、天命、守护、万妖，各自有城池、利益与内部矛盾。把他们都看成同一支军队，会误判很多事。\n情报并不等于盟约。你们需要分清哪些分歧可以利用，哪些只是诱饵。',[
O('建立分势力档案，不轻信单一消息','每条情报标上来源与可信度。图上的敌人终于有了不同的动机，而不是同一种颜色。',{intel:15,flags:['courts_dossier']}),
O('关注平民与非战斗群体的流动','你发现城池调动之前总有一些细小迹象。战争不只由最强者留下痕迹。',{intel:9,rescue:7,flags:['civilian_route']}),
O('将情报转为前线轮换计划','你没有等到知道所有秘密才行动，而是先减少可以避免的损失。',{defense:12,supply:6})]);
M(7,'一场不在城墙上的交锋','一个地窟地方势力通过中间人提出短期互不越界。它希望保住自己的利益，并不因此突然认同人族。\n你没有权限替全体人类宣布和平，但可以建议一项有范围、有时限、能核验的地方安排。',[
O('提出限区停火与逐项核验','协议只覆盖标出的通道与时间，任何一方违约都留有撤回手段。它不是永恒和平，却买到了真实的喘息。',{defense:8,supply:7,flags:['local_truce']},{intel:55}),
O('拒绝含糊条件，保留沟通渠道','对方没有得到承诺，你们也没有关闭一切可能。防线继续警戒，争论留在桌上。',{intel:6,defense:5,flags:['channel_open']}),
O('先进行小规模互换，验证履约能力','一批约定物资按时送到。有限的信用被记录下来，后续谈判仍须重新判断。',{supply:10,intel:5,flags:['verified_trade']})]);
M(7,'禁区带回来的残页','侦察队带回一些涉及本源与古老势力的残页。字句不完整，解释互相矛盾。最诱人的说法，总是声称拥有一条立刻变强的道路。\n张涛的意见很明确：可以冒险求证，但不要让一份未经核实的情报替所有人下注。',[
O('拆分线索，由独立小组交叉核验','你得到的答案少了一些传奇色彩，却多了几处能够相互印证的细节。',{intel:14,mind:9,flags:['verified_origin']}),
O('在导师保护下进行有限推演','推演没有让你突然拥有皇者力量，却让你看见了自身修炼中的一处误区。',{xp:70,mind:7,injury:4,flags:['origin_trial']}),
O('先封存危险部分，只分享已证实内容','传播速度慢下来，错误也少了。你为未来保留了一份可追溯的原始记录。',{defense:8,mind:8,flags:['sealed_record']})]);
M(7,'人族会议上的座位','你终于有机会把一份完整报告带到人族高层面前。张涛先问人能否撤出，李振则问防线在最坏情况下还能支撑多久。\n如果自身境界尚不足以参战，你仍可以作为前线组织者陈述事实。这里需要可信的报告，而不是夸大的个人战绩。',[
O('如实报告优势与缺口','报告里没有漂亮到不真实的数字。高层调整了支援，你也得到更明确的任务边界。',{defense:12,bonds:{张涛:12,李振:8},flags:['honest_report']}),
O('提出跨区域互援方案','你的方案要求其他地区也保留基本防守。几次修改后，它终于能够落地。',{supply:10,defense:8,bonds:{李振:10},flags:['regional_aid']}),
O('争取给年轻武者更多训练时间','你把长期成长的价值放到急迫战况面前。争来的时间不是免费，需要现有队伍承担轮值。',{xp:65,rescue:6,bonds:{张涛:10},flags:['time_for_youth']})]);
M(8,'你走的是谁的路','关于本源的讨论越来越多。有人把前辈经历奉为范本，有人试图从残篇里找到一模一样的答案。\n李长生听过你的推演，只问了一句：如果没有别人替你命名，你自己的选择是什么？',[
O('把守护具体的人作为起点','你想到的不是模糊口号，而是阳城的饭桌、宿舍的灯、城门口的名单。道路因此有了你自己的理由。',{xp:80,mind:12,flags:['dao_guard']}),
O('以求真立道，不回避代价与矛盾','你承认自己曾经犯错，也愿意在证据改变时修正。不是每个答案都令人舒服。',{xp:80,intel:12,flags:['dao_truth']}),
O('以开路立道，让后来者不必复制苦难','你整理沿途的门槛，寻找哪些可以被制度和知识真正降低。个人进步开始通向更多人。',{xp:80,defense:10,flags:['dao_teach']})]);
M(8,'资源矿脉的归属','一处资源点被成功控制。它尚需守卫、勘探与运输，不能直接算成所有人的修为增长。各支队伍拿出约定，等待兑现。\n你之前主张过怎样分配，如今就必须让同样的规则约束自己。',[
O('按贡献分配，预留公共守备成本','分配慢了一些，却没有把未来的风险留给不在会议上的人。',{credit:30,supply:12,defense:6,flags:['mine_public']}),
O('购买个人配额，集中准备突破','你付出价格并完成登记，矿脉没有因此变成你的私产。其他队伍仍得到应有份额。',{cash:-18,xp:120,flags:['mine_personal']},{cash:18}),
O('优先建立稳定运输线','你先修路、设站、安排轮换。账上的立即收益较少，后续补给却能持续。',{supply:20,intel:5,flags:['supply_route']})]);
M(8,'金身也会留下裂痕','一场冲突之后，你看见高品武者同样在恢复。境界越高，损失未必越容易弥补。不灭物质也不是没有代价的万能答案。\n你可以继续催促队伍前进，也可以承认强者同样需要轮换。',[
O('安排轮换，不让透支变成惯例','前进速度暂时放缓，队伍的伤情却开始真正好转。你也获得一段难得的恢复期。',{injury:-18,energy:25,defense:8,flags:['highrank_rotation']}),
O('投入资源，优先修复关键战力','分配公开后，有人主动让出份额。恢复并非完全，你们仍保留了撤退条件。',{credit:-12,injury:-25,defense:12},{credit:12}),
O('转向侦察与防守，避免正面消耗','你们没有继续追逐战报上的漂亮结果，而是等待一场更有准备的行动。',{intel:12,supply:6,injury:-10})]);
M(8,'战线之外的盟友',s=>s.flags.local_truce?'此前的地方停火仍在执行。对方送来续约要求，希望扩大自己的活动范围。遵守过一份协议，并不意味着下一份也应无条件接受。\n你们拥有的是有限而真实的信用，需要继续用边界保护它。':'没有停火协议覆盖这段边界。中间人再次带来接触请求，声称对方也不愿无止境消耗。\n此前的戒备并非没有理由，新的可能也需要新的证据。',[
O('坚持范围核验，延续有限合作','双方得到一段可以预测的边界。冲突并未从世界消失，但这里暂时少了一种危险。',{defense:12,supply:8,flags:['durable_truce']},{intel:65}),
O('只保留伤员交换与撤离通道','你不承诺军事合作，却让非战斗事务拥有最低限度的规则。',{rescue:14,intel:5,flags:['humanitarian_channel']}),
O('维持武装戒备，以公开信号避免误判','边界仍然紧张，但你们努力让每一次行动不被理解成更大的进攻。',{defense:9,skill:5,flags:['armed_boundary']})]);
M(9,'真相要怎样进入人间','战争已经无法永远藏在少数人的生活之外。有人主张尽快公开，也有人担心未经准备的信息会引起恐慌。\n张涛要的不是一句简单的赞成或反对，而是学校、家庭、物资与秩序怎样接住变化。',[
O('分阶段公开，同时提供可行的避险安排','信息与行动指南一同抵达。你没有许诺毫无危险，却让普通人知道自己能做什么。',{defense:12,rescue:10,flags:['public_prepared']}),
O('先动员地方组织，保证救助入口畅通','武馆、学校与社区开始训练。许多人仍不知道全部真相，但已经不再毫无准备。',{supply:12,rescue:8,flags:['community_ready']}),
O('集中时间培养后备力量，再逐步说明','这条路线争取了训练窗口，也让后来公开承担更大的压力。你留下明确的时间表。',{xp:95,defense:5,flags:['late_disclosure']})]);
M(9,'每条战线都说自己不能少','各地求援同时抵达。你手中的力量有限，任何调动都会让原来的位置变薄。主战场需要强者，撤离通道也需要普通守卫。\n这一次，你无法用亲自上阵代替整个分配问题。',[
O('保留各地底线，组建机动互援队','没有哪一处得到全部想要的援助，至少没有哪一处被默认牺牲。',{defense:14,supply:8,flags:['distributed_defense']}),
O('集中尖刀突破，争取更短的战争','你将风险摊开，请后方先准备承受冲击。计划若无情报支持，收益就不足以覆盖代价。',{skill:12,defense:8,supply:-8,flags:['spear_strategy']},{intel:65}),
O('优先平民撤离，主动收缩部分战线','你让出了空间，换取更多人进入安全区。地图上的退让不代表那些人不值得保护。',{rescue:20,defense:-4,supply:-4,flags:['evacuation_first']})]);
M(9,'同伴提出了反对','一位长期同行的伙伴不同意你的计划。他并非怯战，只是认为你忽略了伤员与补给。其他人等着看，你会如何对待一句不中听的意见。\n权力会让沉默变多，沉默却不会让风险变少。',[
O('公开推演最坏情况，允许修改计划','讨论很慢，几处隐藏的漏洞却因此暴露。伙伴留下来，因为反对不意味着失去位置。',{intel:12,defense:10,bonds:{方平:8,陈云曦:8},flags:['dissent_allowed']}),
O('划出独立行动边界，让不同方案小范围验证','你没有假装所有人达成一致，而是给不同判断设置可承受的试错范围。',{mind:10,supply:8,flags:['limited_trial']}),
O('承担决定责任，另设监督与撤回条件','计划继续，但不再依赖你一个人判断是否失败。有人得到明确权限在必要时叫停。',{defense:10,rep:6,flags:['accountability']})]);
M(9,'人族的底牌不是一张牌','新的支援统计摆在桌上。你看见强者、物资、情报与彼此信任如何相互连接，也看见过去忽略的一环如何拖慢整个体系。\n方平说，账总要算到最后。你开始为最后阶段整理自己的承诺。',[
O('补齐最薄弱的救援与运输环节','你没有继续锦上添花，而是把资源放到最容易断开的地方。',{supply:15,rescue:10,flags:['logistics_ready']}),
O('整合已经建立的关系，明确同行分工','朋友不会因为好感就无限提供力量。你们说清各自承担什么，并保留不参与的自由。',{defense:12,bonds:{方平:8,王金洋:8},flags:['allies_ready']}),
O('沉下心打磨自己的最后一处短板','你没有把个人突破等同于世界得救，只是让自己在需要承担的那一环更加可靠。',{xp:110,mind:10,skill:10,flags:['self_ready']})]);
M(10,'关于源地的危险解释','关于源地、仙源与皇者的情报渐渐拼合。你们看到的不是一座等人拿奖励的遗迹，而是与本源道路、困局和脱困企图纠缠在一起的局面。\n已知依旧有限。你们尤其警惕一种说法：只要让后来的人付出代价，眼前的困境就可以轻松解除。',[
O('优先调查替代与转嫁代价的机制','你们把所有看似免费的提议重新列账。真假混杂的说辞中，几处共同的危险开始显现。',{intel:18,mind:10,flags:['trap_known']}),
O('研究如何保护仍在修炼的后来者','前线之外，更多人的道路也可能受到影响。你们先建立告警与停练方案。',{defense:12,rescue:10,flags:['cultivators_safe']}),
O('把资料交给可信的高层，维持独立备份','你没有独自宣称看透一切。多方核验与备份让一场意外不至于抹去所有线索。',{intel:12,defense:8,flags:['truth_backup']})]);
M(10,'远超你的对手','局势涉及的强者远超普通绝巅。没有人会因为你走到故事后段，就把皇者或天帝变成任你越级击败的弱敌。\n会议给你的是与你能力匹配的位置：足够强则协同行动，尚未达到则守住联络与撤离。每个位置都需要有人。',[
O('申请高阶协同行动，接受严格边界','你进入的是有人族强者承担主战的计划。自己的任务明确到一段时间、一个节点与一条撤离路线。',{skill:15,defense:12,injury:12,flags:['final_assault']},{rank:9,intel:65}),
O('负责跨线联络与情报转送','你守住的信息链使多个行动能够协调。没有人要求你用低阶身体去证明对高阶强者的勇敢。',{intel:15,defense:12,flags:['final_command']}),
O('主持撤离与救援网络','你的战场是拥堵的路线和缺口不断的名单。救回的人没有出现在最高战力榜上，却同样属于未来。',{rescue:20,supply:8,flags:['final_rescue']})]);
M(10,'一条过分轻松的捷径','中间人带来一份无法完全核实的提议：交出一部分未来的选择权，换取眼前的喘息。它没有要求你立刻伤害任何人，只要求你不追问后来会怎样。\n你想起一路上那些没有写进合同的小字，以及为了补救它们付出的代价。',[
O('拒绝转嫁代价，公开可证实的风险','你放弃了一个可能有用的短期筹码，也保留了未来说不的权利。',{mind:15,defense:8,flags:['reject_trap']}),
O('拖延答复，在边界内核验条件','你不作承诺，用有限接触获取更多信息。核验没有让危险消失，却让人族少了一处盲区。',{intel:18,energy:-15,flags:['exposed_terms']},{intel:80}),
O('把提议交由多人审议，禁止私人签署','决定不再掌握在一个人手里。程序没有神奇地解决困局，但阻止了无法撤回的孤注一掷。',{defense:12,mind:8,flags:['shared_veto']})]);
M(10,'最后一次核对名单','行动开始前，你们核对参与者、资源与返回节点。有人会走到最前面，有人留在后方。没有哪份名单能够预先写出所有人的结局。\n你把自己的安排留给同伴，也终于为“如果没能按时回来”写下清楚的处理方法。',[
O('设置接替者，避免一人失联拖垮全局','每个岗位有了能够接手的人。你不是变得不重要，而是让组织不必依赖任何一个人的永远在场。',{defense:15,rescue:8,flags:['succession_ready']}),
O('集中物资保障撤回节点','前进与后退都需要付出资源。你选择先把后退也变成真正可用的方案。',{supply:-10,rescue:18,defense:8,flags:['return_route']},{supply:10}),
O('与同行者谈清各自无法接受的底线','你们并不拥有完全相同的信念，却知道在什么情况下必须互相拉住。',{mind:12,bonds:{方平:10,王金洋:10},flags:['shared_limits']})]);
M(11,'风暴抵达人间',s=>s.flags.durable_truce?'既有的地方停火仍约束着一段边界，那里没有凭空重演旧定的大战。主战线依旧严峻，但你们得以调出一部分守备力量。\n此前为核验与谈判付出的时间，在这一刻变成可以看见的余地。':s.flags.distributed_defense?'分布在各地的守备点接连传回消息。有些地方承压很大，却没有因抽调过度而完全失去组织。\n你之前坚持保留的底线，现在成了人们继续等待援助的理由。':'警报接连抵达。战争没有因为主战场吸引所有目光，就绕过普通人的街道。\n你手中的准备或许并不完美，但仍要把能够用的力量放到具体的位置。',[
O('执行既定防务，优先修补失联节点','你根据真实传讯调整安排，没有把愿望当成战况。防线仍在承压，却保持了相互联系。',{defense:12,intel:6,flags:['line_connected']}),
O('把最后的机动力量用于救援','你选择守住名单上的人。部分区域会失去控制，但幸存者能够进入下一道防线。',{rescue:20,defense:-3,flags:['last_rescue']}),
O('协同反击已经查明的薄弱环节','你打击的是经侦察确认的局部节点，主战的强敌仍由对应层级的强者承担。',{defense:18,injury:10,flags:['counterattack']},{intel:85,rank:7})]);
M(11,'选择之后的世界','最后阶段的消息仍在汇总。你听见了胜利，也听见了失联与退守。任何宏大的结论，都不能替某一个家庭把空位填上。\n你一路建立的救援、补给、关系与规则，正在共同决定人间能够接住多少后果。',[
O('公开战损与缺口，开始善后','你没有用胜利遮住失去。公开的信息让捐助、接替与寻人终于有了准确方向。',{rescue:12,defense:8,flags:['honest_aftermath']}),
O('先稳住基础运转，再逐步汇总消息','吃饭、安置、医疗与联络被摆到前面。人们还在等待答案，至少不用在等待中失去照顾。',{supply:15,rescue:8,flags:['rebuild_services']}),
O('组织独立复盘，让错误留下可改的记录','有人不愿重新谈起失败。你坚持复盘不是为了制造替罪者，而是减少下一次重复。',{intel:15,mind:8,flags:['war_review']})]);
M(11,'回到最初的地方',s=>s.flags.hometown_promise?'你想起曾经答应吴志豪的那间武馆。经历了这么多，旧日诺言没有自动兑现，却也没有失去意义。\n阳城的街道和记忆不完全一样。有些人长高了，有些店换了招牌，仍有人等着一扇愿意向普通学生打开的门。':'当你再次想起阳城，首先浮现的不是自己的气血数字，而是报名表、饭桌与窗外的铃声。\n你已经走了很远。此后的人生，不必只由战争与修炼来定义。',[
O('办一间有补助名额的武馆','你将个人资源投入招生与师资。第一批学生不需要知道你全部的经历，只需要得到可靠的起点。',{cash:-12,defense:10,rescue:8,flags:['school_built']},{cash:12}),
O('把经历与战法整理成公开教材','你保留了犹豫和失败的部分，让后来者知道前人也不是一路正确。',{mind:10,defense:8,flags:['textbook_done']}),
O('陪家人与故友，先过一些普通日子','没有人替你颁奖。桌上多了一副碗筷，旧友问你想吃什么，你终于有时间认真回答。',{energy:30,mind:12,flags:['home_at_last']})]);
M(11,'你的答案','这卷故事即将落笔。你的境界不能替每个选择辩护，许多普通决定却会在更远的地方留下回声。\n你可以继续走武道，也可以开始教人、守城、研究与生活。人间并非一场打完便不再需要照顾的战役。',[
O('继续守护，承担留下来的责任','你没有宣称此后再无危险，只愿意在需要的时候继续出现。',{defense:8,flags:['epilogue_guard']}),
O('继续求索，把未解之谜交给更可靠的证据','绝巅之后仍有更远的天地。你带着清楚的边界继续探索，没有把这本纪事当成原著全部终局。',{intel:10,flags:['epilogue_seek']}),
O('把路交给后来者，保留自己的普通生活','传承不是让每个人成为你的复制品。你给他们知识、选择和说不的余地。',{rescue:8,mind:8,flags:['epilogue_teach']})]);
const ORIGIN_SCENES={
yang:[

['有人劝你把所有资源迁往名校所在的大城。这样管理更方便，但故乡那条刚刚修好的起步道路可能重新荒下去。','保留南江的教学点','建立跨城轮值，资源共同使用','让本地教师独立管理并公开账目']

],
merchant:[

],
healer:[

['一名伤员希望继续上前线，担心错过任务便失去资源。你能说明风险，却没有权利替他把所有选择收走。','安排恢复期可做的工作','争取临时补助，减少经济压力','约定复查条件，允许有限参与'],

],
craft:[

],
wanderer:[

['师傅终于讲起当年一次失败的任务。他并非不敢战，而是在错误情报下失去了撤退机会。多年来，他一直怪自己没有更强。','帮他复盘，区分责任与遗憾','推动旧案的合理核查','先听他说完，不急着下结论'],
['几名社会武者想进入更正规的训练体系，却没有稳定资源与推荐关系。你可以为他们引路，也必须承认每个人基础不同。','建立公开能力评估与补修','开放基础课程与任务安全训练','邀请社会武者分享实际经验']

['你终于能回答那封当年太短的信。继承亲人的道路不是唯一答案，把遗憾变成对后来者的照顾也可以是一种回应。','建立遗属长期支持机制','继续自己的道路，不替逝者活一生','为等待消息的人整理查询与援助流程']
]};
const ORIGIN_IDS={};

O(a[1],'你把这项选择落实到具体安排，并将承担的成本记入自己的账。它不会替所有人解决一生，却让眼前的一段路能够继续。',{cash:i===2?-8:-3,rescue:6+i*2,rep:3,bonds:{[o.bond]:5},flags:['origin_'+o.id+'_care']},{cash:i===2?8:3}),
O(a[2],'你与对方说清彼此能做的部分。答复不夸张，也没有把选择的责任丢给任何一个人。',{xp:20+i*10,mind:5,bonds:{[o.bond]:7},flags:['origin_'+o.id+'_path']}),
O(a[3],'你留下记录与联络方式，让这次帮助不必只依赖某个人恰好在场。后来的人可以接手，也可以据此提出修改。',{intel:5,defense:5+i*2,bonds:{[o.bond]:4},flags:['origin_'+o.id+'_build']})],{kind:'出身专属',origin:o.id}));}
const SIDES=[];
function SEvent(id,title,text,when,choices){SIDES.push(E(id,title,text,choices,{kind:'因果支线',when}));}
SEvent('s_family','来自家里的第二封信','家人看懂了你逐笔记下的开支，说愿意继续支持，但希望你不要把疲惫藏起来。\n你第一次觉得，报平安也可以是一场诚实的谈话。',s=>s.flags.family_debt&&s.turn>=3,[O('告诉他们最近的困难','你们把能承受的边界说清。家人没有解决所有问题，却不再被隔在你的生活之外。',{mind:6,energy:15,flags:['family_trust']}),O('用任务所得补贴家用','你寄回一笔钱，并附上真实的近况。',{cash:-5,rep:6,flags:['family_supported']},{cash:5})]);
SEvent('s_group','互助小组的第一次分歧','小组有人进步很快，有人仍卡在基础。资源和时间有限，一起开始的人未必能保持同样速度。',s=>s.flags.study_group&&s.turn>=5,[O('按需求分组，保留共同交流','你们不再用完全相同的计划要求每个人。',{defense:6,mind:5}),O('轮流分享一项真正有效的经验','分享暴露了差异，也带来可学的东西。',{xp:30,bonds:{傅昌鼎:6,陈云曦:6}})]);
SEvent('s_rival','赵磊的改招','赵磊拿着上次切磋记录来找你。他补上了那个破绽，还想知道你下一次会怎样应对。',s=>s.flags.rival_respect&&s.turn>=6,[O('认真再练一场','竞争成为双方继续进步的理由。',{skill:10,energy:-10,bonds:{赵磊:8}}),O('交换思路，把经验留给小组','你们把面子放在记录之外。',{intel:5,defense:4,bonds:{赵磊:6}})]);
SEvent('s_reserve','替补队员的邀请','你曾信任的替补邀请你一起练习。他记得你受伤时交出的战术，也希望下一次能更值得那份信任。',s=>s.flags.trust_reserve&&s.turn>=9,[O('继续完善轮换战术','主力与替补的边界变得更灵活。',{defense:8,skill:5}),O('让他带新一批学生训练','一份信任开始向后来者传递。',{rep:6,rescue:4})]);
SEvent('s_elite','等待资源的人','优先培养强者的方案见到了收益，也有人问：下一轮什么时候轮到我们？集中资源的决定，需要持续解释。',s=>s.flags.elite_fund&&s.turn>=10,[O('公开下一轮分配，补给等待者','你付出资源，兑现轮换的承诺。',{credit:-5,defense:9,flags:['elite_repaid']},{credit:5}),O('延续集中培养，承认信任的损失','你选择更快增长，但队伍不再无条件接受你的判断。',{xp:40,defense:-5,bonds:{陈云曦:-6}})]);
SEvent('s_mutual','互助池开始运转','第一笔借出的资源归还了。有学生希望扩大规模，也有人担心这会变成一项所有人都必须参加的负担。',s=>s.flags.mutual_fund&&s.turn>=10,[O('坚持自愿与公开账目','小基金增长得慢，却保留了可信的边界。',{supply:8,rescue:5}),O('寻找校方配套，先做小范围试行','更多人被纳入，但试行规模仍可管理。',{defense:7,credit:5})]);
SEvent('s_signal','约定的撤退信号','秦凤青在外沿发现一条新路。他没有像从前那样直接冲出去，而是先问你原来的撤退信号是否仍然有效。',s=>s.flags.retreat_signal&&s.turn>=12,[O('重新确认时间与联络点','你们获得有限的额外收获，按时回来。',{credit:10,intel:6,bonds:{秦凤青:8}}),O('这次不深入，将线索交给侦察队','机会留下了记录，也交给更合适的人。',{defense:6,intel:8})]);
SEvent('s_saved','救回来的人带回消息','曾获救的队员完成恢复，带回一份新侦察结果。他没有把你当成可以无限索求的恩人，只说自己想把欠下的接应还给更多人。',s=>s.flags.team_saved&&s.turn>=15,[O('把他编入新救援网','防线得到了一名愿意承担责任的熟手。',{defense:9,rescue:8}),O('让他独立报告，不以恩情换服从','不同意见得到认真听取。',{intel:10,rep:5})]);
SEvent('s_loss','需要一个明确答案的家属','失联队员的家属等在登记处。他们问的不是谁应该被赞扬，而是究竟确认了什么、还有什么不知道。',s=>s.flags.team_lost&&s.turn>=15,[O('如实解释经过，协助后续查询','你没有编造希望，也没有用一句抱歉结束谈话。',{rescue:8,mind:5,flags:['loss_faced']}),O('推动独立核查，接受对自己判断的复盘','记录将长久保留，包括你当时作出的取舍。',{intel:8,defense:5,flags:['loss_reviewed']})]);
SEvent('s_medicine','药库里多出来的名字','此前补足的药品帮助一批伤员度过恢复期。名单并非全部划掉，仍有人需要长期照顾。',s=>s.flags.medical_stock&&s.turn>=16,[O('建立复查与后续援助','你没有把一次送药当成所有问题的结束。',{rescue:10,defense:5}),O('请康复者参与基础救护训练','有限的经验成为可以传播的能力。',{supply:6,rep:6})]);
SEvent('s_teacher','恢复研究的下一步','你找到的恢复线索有一部分获得验证，另一些仍缺证据。李长生提醒你，不能为了想让一个人好起来，就把传闻当成答案。',s=>s.flags.healing_research&&s.turn>=18,[O('只推进有证据的部分','研究慢了一些，却没有额外伤害需要帮助的人。',{intel:9,bonds:{李长生:10},flags:['care_evidence']}),O('交由更专业的人继续，自己筹集资源','你承担自己能做的环节。',{credit:-5,rescue:8,bonds:{李长生:8}},{credit:5})]);
SEvent('s_manual','公共课的第一次回信','一名低品学生按你整理的课程纠正了动作。他在信末写下一个新问题，是你原先没有考虑过的体型差异。',s=>s.flags.public_manual&&s.turn>=19,[O('修订教材，注明适用范围','公开课程因为能够修正，变得更可靠。',{skill:7,defense:8}),O('邀请他参与下一版编写','知识不再只有一个固定的授予者。',{mind:8,rep:5})]);
SEvent('s_private','未整理完的课程','你已经从战法稿中得到许多进步。负责课程的老师再次问，有没有时间补上最初欠下的公开整理？',s=>s.flags.private_manual&&s.turn>=20,[O('拿出一段时间完成整理','个人收获终于回到更多学生手中。',{energy:-15,defense:10,flags:['manual_shared_late']}),O('明确拒绝，把原稿交给愿意接手的人','你没有继续占着机会，也没有得到公共教学的声望。',{mind:5,intel:4})]);
SEvent('s_junior','学弟重新递来申请','经过一段低风险任务与训练，那位新生再次申请外勤。这次他的准备比第一次充分，也能说清退路在哪里。',s=>s.flags.junior_safe&&s.turn>=22,[O('按实际能力批准进阶任务','你看见的是具体进步，而不是曾被保护的标签。',{defense:8,rescue:6}),O('让他带领一次安全训练，再核验能力','教学帮助他发现了自己还没掌握的细节。',{mind:7,defense:7})]);
SEvent('s_teaching','外派教学的承诺到期','地方武大寄来时间表，提醒你曾承诺的外派课程。这个月同样有修炼与任务，你不能再只把共享写在纸上。',s=>s.flags.teaching_debt&&s.turn>=23,[O('安排课程并交出完整资料','承诺终于获得可以核验的内容。',{energy:-15,defense:12,bonds:{王金洋:8},flags:['teaching_paid']}),O('支付代课与组织成本，确保如期完成','你无法亲临，但责任没有因此取消。',{cash:-8,defense:10,flags:['teaching_paid']},{cash:8}),O('交出资料并协调接替者，明确延后课时','你无法独自完成全部课程，便先交出资料与权限。现场课程延后，但承诺不再只是无人接手的一句话。',{defense:4,flags:['teaching_paid']})]);
SEvent('s_truce','停火线的第一次争议','边界发生一次未明冲突。双方都说不是自己的命令。协议的价值，正在于此时能否阻止局势无条件升级。',s=>s.flags.local_truce&&s.turn>=24,[O('核对证据，按既定机制处理','冲突没有被抹去，但没有扩散成整段边界的战争。',{intel:10,defense:8,flags:['truce_tested']}),O('暂时缩小协议范围，保留核查','合作减少，最小沟通仍在。',{supply:-4,defense:6,flags:['truce_narrowed']})]);
SEvent('s_route','运输线的维修请求','稳定运输带来持续补给，也带来维护成本。几处路段已出现损坏，继续压榨使用会让先前投入一起受损。',s=>s.flags.supply_route&&s.turn>=27,[O('投入维修，把长期收益保住','运输有所延迟，路线仍然可靠。',{cash:-6,supply:12,flags:['route_maintained']},{cash:6}),O('暂时降低运量，安排分段维护','速度慢下来，没有任由损坏累积。',{supply:5,defense:5})]);
SEvent('s_civil','通道上的无武者家庭','此前记录的平民流动线索变成一条可用撤离通道。没有气血优势的人走得很慢，队伍需要安排额外掩护。',s=>s.flags.civilian_route&&s.turn>=27,[O('安排掩护，按家庭登记撤离','没有让无力奔跑的人自动落在最后。',{rescue:15,supply:-5}),O('分段建立接力点','效率并非凭空提升，它来自更细的组织。',{rescue:10,defense:7})]);
SEvent('s_truth','一条与旧结论矛盾的证据','新证据推翻了你关于本源的一部分推断。坚持原结论会更容易维护名声，却会让之后的计划踩在错误的基础上。',s=>s.flags.dao_truth&&s.turn>=28,[O('公开修正结论','你失去一部分笃定，获得更值得信任的判断。',{intel:12,mind:8}),O('请独立团队复核，暂缓依赖此结论的行动','延迟真实存在，错误却没有继续扩散。',{defense:8,intel:10})]);
SEvent('s_community','普通人的演练','社区演练中，有人不相信危险会来，也有人因为紧张反而堵住了通道。纸上的方案第一次遇到真正的人群。',s=>s.flags.community_ready&&s.turn>=30,[O('简化指引，反复演练最关键的动作','没有要求每个人成为英雄，只让更多人知道下一步。',{rescue:12,defense:6}),O('培训本地负责人，减少临时指挥混乱','熟悉社区的人承担了可以承担的位置。',{supply:8,rescue:10})]);
SEvent('s_disagreement','反对者还在队伍里','那个提出反对的人再次带来一份不太好看的报告。他知道你可能不高兴，但没有选择把问题藏起来。',s=>s.flags.dissent_allowed&&s.turn>=31,[O('把报告纳入最终安排','制度的意义体现在仍能听见麻烦的时候。',{intel:12,defense:8}),O('让他负责独立风险核验','反对不自动正确，但值得得到核验的权限。',{mind:8,defense:9})]);
SEvent('s_archive','备份记录的用处','一条联络链中断了。幸好关键资料还有独立备份，你们不必在压力最大时重新猜测过去的决定。',s=>s.flags.truth_backup&&s.turn>=33,[O('恢复资料并检验一致性','信息链重新接上，错误副本也被剔除。',{intel:12,defense:9}),O('让更多关键节点具备最低备份能力','没有追求无限冗余，只保住最不能丢的一部分。',{supply:7,defense:10})]);
SEvent('s_succession','接替者独自作出了决定','你离开岗位时，接替者依照约定作出一次撤离决定。结果不完美，却在权限范围内避免了更大损失。',s=>s.flags.succession_ready&&s.turn>=34,[O('支持其合法决定，共同复盘','你没有因为结果不够漂亮就收回所有权限。',{defense:10,rescue:8}),O('细化权限边界，保留自主处理的空间','规则更清楚，但人没有重新变成只会等待命令的工具。',{intel:8,defense:9})]);
SEvent('s_home','武馆门口的新名字','捐助名单里出现了一个陌生名字，附言说自己受过你公开课程的帮助。回响没有沿着原来的方向回来，却仍然抵达这里。',s=>s.flags.school_built&&s.turn>=35,[O('公开使用安排，让帮助继续','你把款项归入课程与补助，不将它视作私人收入。',{defense:8,rescue:8}),O('邀请捐助者参与监督','善意有了可以追问的地方。',{intel:7,rep:8})]);
const OPPORTUNITIES=[
{id:'q_library',name:'图书馆的桩功批注',place:'阳城',stage:0,desc:'一份校友留下的基础笔记，需要时间辨清哪些适合你。',cost:0,req:{},choices:[O('逐条验证批注','你没有照抄每一句话，练出了真正适合自己的部分。',{xp:28,mind:6}),O('与同学共同校读','不同的问题让这份笔记变得更完整。',{intel:6,bonds:{吴志豪:8}})]},
{id:'q_market',name:'旧器材交易角',place:'阳城',stage:0,desc:'一批退役训练器材待售，检查与修复比砍价更重要。',cost:0,req:{},choices:[O('买下合格的基础器材','你核对过承重与裂纹，带回适合训练的一套。',{cash:-4,gear:1,xp:15},{cash:4}),O('帮其他考生挑选，换取训练机会','器材不是你的，但你获得了共同使用的安排。',{skill:7,rep:3})]},
{id:'q_blade',name:'后勤部的试刀名额',place:'魔武',stage:1,desc:'新版训练兵器需要试用反馈，奖励是正式登记的兑换配额。',cost:0,req:{},choices:[O('完成全套测试','你记录了缺陷，没有只报好消息。',{gear:2,skill:8,flags:['blade_tested']}),O('整理试用意见，换学分','你用工作换来清楚的报酬。',{credit:10,intel:5})]},
{id:'q_workshop',name:'战法研讨会',place:'魔武',stage:1,desc:'名额有限，重点是分析适用条件，不是获得万能招式。',cost:0,req:{},choices:[O('带着自己的问题参加','问题被拆开以后，训练有了新方向。',{skill:10,mind:7}),O('帮忙记录，领取资料授权副本','你没有独占资料，获得的是可以合法分享的整理版。',{intel:9,defense:4})]},
{id:'q_sponsor',name:'地方奖助计划',place:'南江',stage:2,desc:'一笔公开的奖助资金，要求申请者履行一次基础教学。',cost:0,req:{},choices:[O('接受奖助并完成教学','收入对应真实付出，你也在教学中修正了表达。',{cash:12,xp:20,defense:5}),O('推荐更需要资助的学生','这次机会没有进入你的个人账，却改变了别人的起点。',{rep:8,rescue:6})]},
{id:'q_patrol',name:'希望城外的巡防缺口',place:'希望城',stage:3,desc:'正规巡防任务。可选择后勤支援或正面处理一支低品侦察分队。',cost:0,req:{},choices:[O('随队处理侦察分队','你在划定的范围内完成交锋，未越界追击。',{credit:18,skill:9,defense:7},{rank:2},{enemyRank:2,enemySkill:12}),O('补齐哨点与联络物资','任务同样完成，报酬按后勤工作结算。',{credit:10,intel:7,supply:5})]},
{id:'q_crystal',name:'废弃矿道的资源线索',place:'地窟外域',stage:4,desc:'侦察确认的小型矿点。先厘清风险与团队归属，再决定如何获取。',cost:0,req:{intel:20},choices:[O('以情报换取登记份额','你没有声称矿点已被自己占有，带回的是团队分配后的资源。',{credit:20,cash:10,supply:5}),O('随队清理矿道守卫','遭遇的是外围守卫，矿点后续仍需组织管理。',{credit:30,xp:45},{rank:4},{enemyRank:4,enemySkill:24})]},
{id:'q_lost',name:'无主背包的身份牌',place:'地窟外域',stage:4,desc:'背包不意味着物品天然属于发现者，身份牌上仍能看清姓名。',cost:0,req:{},choices:[O('送回登记处寻找失主','物品登记归还，你收到正式的协助奖励。',{credit:8,rep:8,rescue:5}),O('根据路线补充失联调查','身份牌提供了一条仍可追索的线索。',{intel:10,rescue:8})]},
{id:'q_manual',name:'封门经验的公开讲座',place:'魔武',stage:5,desc:'六品武者谈三焦之门。低品可以理解原则，高品可以校正实践。',cost:0,req:{},choices:[O('对照自身修炼记录听讲','你知道哪些还需要等待，哪些可以现在纠正。',{xp:65,mind:10}),O('将经验改编成分级笔记','避免把高阶段的要求直接压给初学者。',{intel:10,defense:6})]},
{id:'q_guard',name:'边界镇的联防请求',place:'希望城',stage:6,desc:'守备力量紧张，小范围联防能减少重复巡逻。',cost:0,req:{},choices:[O('建立共享值班与通报规则','巡防覆盖变好，人员仍有机会休整。',{defense:14,supply:6}),O('实战清除已确认的袭扰点','你针对的是侦察确认的敌方战队，不是整个城池。',{defense:18,credit:25},{rank:6},{enemyRank:6,enemySkill:40})]},
{id:'q_courts',name:'王庭信使的行程残卷',place:'禁区边界',stage:7,desc:'残卷真假待辨。贸然使用，可能把整支队伍引向错误地点。',cost:0,req:{intel:45},choices:[O('交叉核验后建立档案','你提取出可靠的一小部分，不制造虚假的完整地图。',{intel:17,defense:6}),O('交给专门团队，换取后续通报','你保留信息来源，让更适合的人完成鉴别。',{intel:12,supply:8})]},
{id:'q_origin',name:'本源推演室的空位',place:'魔武',stage:8,desc:'一次受监督的推演，只帮助理解，不直接授予他人的本源道。',cost:0,req:{mind:45},choices:[O('推演自己最坚持的选择','记忆与判断逐渐形成连续的线，而不是别人的答案。',{xp:100,mind:12}),O('与不同道路的同伴对照','你们找到差异，也承认道路不能简单复制。',{xp:65,intel:12,bonds:{王金洋:6}})]},
{id:'q_return',name:'最后一条回程线',place:'禁区边界',stage:9,desc:'后勤希望有人将分散的撤离节点连接起来。',cost:0,req:{},choices:[O('付出资源建立接应点','回程计划变成了真正有物资和人员的通道。',{credit:-10,rescue:20,supply:10},{credit:10}),O('核查旧路线，标出可靠的部分','资源有限时，准确本身就是一种支援。',{intel:15,rescue:12})]},
{id:'q_archive',name:'三界资料的最后拼图',place:'人族议事厅',stage:10,desc:'高层核验过的资料提供有限线索，不意味着掌握全部终局真相。',cost:0,req:{intel:70},choices:[O('研究风险与代价如何传递','你看清一处此前被漂亮说辞掩盖的成本。',{intel:20,mind:12}),O('整理避险建议交给后备力量','难懂的理论被转成可以执行的边界。',{defense:15,rescue:10})]}
];
for(const q of OPPORTUNITIES)E(q.id,q.name,q.desc+'\n这次机缘只结算一次。选择之后，资源归属与结果都会留在纪事中。',q.choices,{kind:'探索机缘',opportunity:q.id});

function turnNarrativePage(s,mode){const p=narrativePosition(s);if(!p||s.result)return false;s.reader={event:p.e.id,index:mode==='skip'?p.pages.length-1:clamp(p.index+(mode==='next'?1:-1),0,p.pages.length-1)};return true;}
function narrativeCommandAllowed(s,a){if(frontierActive(s))return ['frontMove','frontAck'].includes(a);return !narrativeActive(s)||['scenePrev','sceneNext','sceneSkip','choose','ack','focusStory','introStory','duelMove','leaveOuting','leaveTrial'].includes(a);}

function startLife(s){s.life.enabled=true;if(s.turn===0&&!s.done.length){s.queue=s.queue.filter(id=>!['m0_0','m0_1'].includes(id));s.queue.unshift('life_prologue');}return s;}
function lifeAction(s,c){return c.lifeAction==='calibrate'?introSecondAction(s):c.lifeAction;}
function learnLife(s,key){if(key&&LIFE_LORE[key]&&!s.life.knowledge.includes(key))s.life.knowledge.push(key);}
function nextLifeEvent(s,id){const p=LIFE_PLACES.find(p=>p.id===id);return p?.ids.find(e=>!s.done.includes(e))||null;}
function lifeOutingMissing(s,c){return c.lifeAction?actionMissing(s,lifeAction(s,c)):[];}
function outingMissing(s,id){if(narrativeActive(s))return ['先完成眼前的事'];if(chapter(s)>0)return ['这段备考生活已经结束，后续会通过来信接续'];if(s.place!=='阳城')return ['先回阳城'];const e=nextLifeEvent(s,id);if(!e)return ['这里的三次经历已完成'];if(s.ap<1)return ['本期时间已用尽'];if(!EVENTS[e].choices.some(c=>!lifeOutingMissing(s,c).length&&!choiceMissing(s,c).length))return ['精力不足，先休整'];return [];}
function enterOuting(s,id){const m=outingMissing(s,id);if(m.length)return {ok:false,text:m.join('；')};s.life.enabled=true;s.queue.push(nextLifeEvent(s,id));return {ok:true};}
function leaveOuting(s){const e=EVENTS[s.queue[0]];if(!e?.outing||s.result)return {ok:false,text:'当前不能离开'};s.queue.shift();s.reader=null;return {ok:true};}
function finishLifeChoice(s,e,c){learnLife(s,e.knowledge);if(e.id==='life_letter'&&s.flags.life_support){s.result.ds.push(...effect(s,{cash:4}));s.result.result+='\n家里寄来的 4 万周转款已收到。这份支持来自你先前留下的家用。';}if(e.id==='life_frontline'&&s.flags.life_verified){s.result.ds.push(...effect(s,{intel:4}));s.result.result+='\n当年的核验记录补全了一段可用的转运线索。';}if(!e.outing)return;if(c.lifeAction){const result=act(s,lifeAction(s,c));if(!result.ok)throw Error('城中行动预检与结算不一致');const ds=clone(s.log.at(-1).ds);s.result.ds.push(...ds);s.result.result+='\n'+(s.systemIntro.last?.turn===s.turn&&s.systemIntro.step>0?'你把这次经历记进训练记录。系统任务与训练收益已按实际行动结算。':'这段时间已经用完，经历与成长一并记进你的记录。');}s.life.visits.push(e.id);}
